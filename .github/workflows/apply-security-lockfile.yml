name: Apply security lockfile artifact

on:
  push:
    branches:
      - codex-security/deep-audit-2026-08-09
    paths:
      - .github/workflows/apply-security-lockfile.yml

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.actor == github.repository_owner &&
      github.event.head_commit.message == 'ci: apply audited lockfile handoff'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ARTIFACT_ID: '9033357332'
      EXPECTED_LOCK_SHA256: 'cc9a852e4be2b116e9181f428b31fdb49024fa5707f183424438914f46737729'

    steps:
      - name: Download audited lockfile artifact from Offline-Toolchains
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/fichario-lock.zip"
          api="https://api.github.com/repos/Semogtw/Offline-Toolchains/actions/artifacts/${ARTIFACT_ID}/zip"
          if ! curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --output "$artifact" "$api"; then
            curl --fail --silent --show-error --location \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              --output "$artifact" "$api"
          fi

          python3 - "$artifact" "$RUNNER_TEMP/pnpm-lock.yaml" <<'PY'
          import hashlib
          import pathlib
          import sys
          import zipfile

          archive = pathlib.Path(sys.argv[1])
          output = pathlib.Path(sys.argv[2])
          expected = 'cc9a852e4be2b116e9181f428b31fdb49024fa5707f183424438914f46737729'
          with zipfile.ZipFile(archive) as source:
              candidates = []
              for info in source.infolist():
                  path = pathlib.PurePosixPath(info.filename)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit('unsafe artifact path')
                  if path.name == 'pnpm-lock.yaml':
                      candidates.append(info)
              if len(candidates) != 1:
                  raise SystemExit(f'expected one pnpm-lock.yaml, found {len(candidates)}')
              content = source.read(candidates[0])
          digest = hashlib.sha256(content).hexdigest()
          if digest != expected:
              raise SystemExit(f'lockfile digest mismatch: {digest}')
          output.write_bytes(content)
          PY

      - name: Commit only the verified lockfile through the Contents API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          meta="$RUNNER_TEMP/current-lock.json"
          payload="$RUNNER_TEMP/update-lock.json"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/pnpm-lock.yaml"
          curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --get --data-urlencode "ref=${GITHUB_REF_NAME}" \
            --output "$meta" "$api"

          python3 - "$meta" "$RUNNER_TEMP/pnpm-lock.yaml" "$payload" "$GITHUB_REF_NAME" <<'PY'
          import base64
          import json
          import pathlib
          import sys

          current = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          content = base64.b64encode(pathlib.Path(sys.argv[2]).read_bytes()).decode('ascii')
          payload = {
              'message': 'security: refresh lockfile for patched dependencies',
              'content': content,
              'sha': current['sha'],
              'branch': sys.argv[4],
          }
          pathlib.Path(sys.argv[3]).write_text(json.dumps(payload), encoding='utf-8')
          PY

          curl --fail --silent --show-error \
            -X PUT \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data-binary "@$payload" \
            "$api" >/dev/null

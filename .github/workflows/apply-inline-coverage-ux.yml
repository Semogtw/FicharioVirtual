name: Apply simplified coverage UX

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-inline-coverage-ux.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply UX patch
        shell: bash
        run: |
          git show 42946c19ffa83ffe22f7fc7db4d0aea6d9cf3560:.github/workflows/apply-inline-coverage-ux.yml > /tmp/ux-patch-source.yml
          python <<'PY'
          from pathlib import Path
          source = Path('/tmp/ux-patch-source.yml').read_text()
          block = source.split("          python <<'PY'\n", 1)[1].split("\n          PY\n", 1)[0]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          exec(compile(code, 'apply-inline-coverage-ux.py', 'exec'))
          path = Path('src/routes/coverage/+page.svelte')
          text = path.read_text()
          text = text.replace("\tconst bulkPlaceholder =\n\t\t'3.1 Temperatura\\n3.2 Calor específico\\n3.3 Mudanças de fase\\n3.4 Primeira lei da termodinâmica';\n", '')
          start = text.index('\n\tlet duplicateCount = $derived(')
          end = text.index('\n\n\tconst statusLabel', start)
          text = text[:start] + text[end:]
          path.write_text(text)
          PY
      - name: Format changed files
        run: pnpm exec prettier --write src/routes/coverage/+page.svelte src/lib/components/UnifiedImportPage.svelte src/lib/components/ImportQueueTray.svelte src/routes/library/+page.svelte src/routes/drive/jobs/+page.svelte src/routes/import/drive/+page.svelte tools/checks/check-real-app-actions.mjs tests/unit/routes/drive-import-page.test.ts tests/unit/routes/coverage-entry-ux.test.ts
      - name: Verify
        run: pnpm verify
      - name: Commit and push
        shell: bash
        run: |
          rm .github/workflows/apply-inline-coverage-ux.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: simplify coverage entry and user-facing copy"
          git pull --rebase origin main
          git push origin HEAD:main

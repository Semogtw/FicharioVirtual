name: Apply visual 15-document diagnostic

on:
  push:
    branches: [fix/visual-retrieval-benchmark-15]
    paths:
      - .github/workflows/apply-visual15-diagnostic.yml
      - .ci/visual15/**

permissions:
  contents: write

concurrency:
  group: apply-visual15-diagnostic
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/visual-retrieval-benchmark-15
          fetch-depth: 0
          persist-credentials: true

      - name: Apply verified diagnostic patch
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/visual15/part-* > /tmp/visual15.patch
          git apply --check /tmp/visual15.patch
          git apply /tmp/visual15.patch

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and validate diagnostic harness
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write tools/checks/check-visual-semantic-staging.mjs
          node --check tools/checks/check-visual-semantic-staging.mjs
          pnpm exec eslint tools/checks/check-visual-semantic-staging.mjs
          git diff --check

      - name: Commit diagnostic harness
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci/visual15 .github/workflows/apply-visual15-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test(search): expand visual staging diagnostics to 15 documents'
          git push origin HEAD:fix/visual-retrieval-benchmark-15

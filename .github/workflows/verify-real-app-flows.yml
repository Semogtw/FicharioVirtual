name: Verify real deployed app flows

on:
  workflow_run:
    workflows: [Deploy validated Fichário artifact to Cloudflare Pages]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# These flows use the same protected staging account as the Supabase contract
# verifiers. Serialize them so one run cannot globally revoke another session.
concurrency:
  group: staging-contract-verification
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment: staging
    env:
      TARGET_URL: https://fichario-virtual.pages.dev
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      STAGING_AUTHORIZED_EMAIL: ${{ secrets.STAGING_AUTHORIZED_EMAIL }}
      STAGING_AUTHORIZED_PASSWORD: ${{ secrets.STAGING_AUTHORIZED_PASSWORD }}
      REAL_APP_REPORT_PATH: /tmp/real-app-flow-report.json
      REAL_APP_EVIDENCE_DIR: /tmp/real-app-flow-evidence
      REAL_APP_ACTION_REPORT_PATH: /tmp/real-app-action-report.json
      REAL_APP_ACTION_EVIDENCE_DIR: /tmp/real-app-action-evidence
      REAL_APP_EXHAUSTIVE_REPORT_PATH: /tmp/real-app-exhaustive-report.json
      REAL_APP_EXHAUSTIVE_EVIDENCE_DIR: /tmp/real-app-exhaustive-evidence
      REAL_APP_SPECIAL_REPORT_PATH: /tmp/real-app-special-report.json
      REAL_APP_SPECIAL_EVIDENCE_DIR: /tmp/real-app-special-evidence
      REAL_SCANNED_PDF_REPORT_PATH: /tmp/real-scanned-pdf-import-report.json
      REAL_SCANNED_PDF_EVIDENCE_DIR: /tmp/real-scanned-pdf-import-evidence
      PLAYWRIGHT_BROWSERS_PATH: /tmp/fichario-real-flow-browsers

    steps:
      - name: Validate immutable test target
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$STAGING_SUPABASE_URL"
          test -n "$STAGING_SUPABASE_PUBLISHABLE_KEY"
          test -n "$STAGING_AUTHORIZED_EMAIL"
          test -n "$STAGING_AUTHORIZED_PASSWORD"

      - name: Fetch exact-SHA real-flow verifiers without repository checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fichario-real-flow
          for verifier in check-real-app-flows.mjs check-real-app-actions.mjs check-real-app-exhaustive.mjs check-real-app-special-routes.mjs check-real-scanned-pdf-import.mjs; do
            curl --fail --silent --show-error --location \
              "https://raw.githubusercontent.com/Semogtw/FicharioVirtual/${TARGET_SHA}/tools/checks/${verifier}" \
              --output "/tmp/fichario-real-flow/${verifier}"
            test -s "/tmp/fichario-real-flow/${verifier}"
          done
          printf '%s\n' '{"private":true,"type":"module"}' > /tmp/fichario-real-flow/package.json

      - name: Align exact-SHA verifiers with current accessible controls and custom dialogs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          notice_old = r"arquivo\(s\) adicionados à fila global"
          notice_new = r"arquivo\(s\) adicionados\."
          for verifier, expected_count in [
              ('check-real-app-flows.mjs', 2),
              ('check-real-app-actions.mjs', 1),
              ('check-real-app-exhaustive.mjs', 1),
          ]:
              verifier_path = Path('/tmp/fichario-real-flow') / verifier
              source = verifier_path.read_text(encoding='utf-8')
              if source.count(notice_old) != expected_count:
                  raise SystemExit(f'unexpected simplified import notice contract in {verifier}')
              verifier_path.write_text(source.replace(notice_old, notice_new), encoding='utf-8')

          core_path = Path('/tmp/fichario-real-flow/check-real-app-flows.mjs')
          core = core_path.read_text(encoding='utf-8')
          core_replacements = [
              (
                  "expectedOccurrences === 1 ? '1 ocorrência' : `${expectedOccurrences} ocorrências`,",
                  "expectedOccurrences === 1 ? '1 ocorrência nesta página' : `${expectedOccurrences} ocorrências nesta página`,",
              ),
              ('expectedOccurrences: 4', 'expectedOccurrences: 2'),
          ]
          for old_core, new_core in core_replacements:
              if core.count(old_core) != 1:
                  raise SystemExit(f'unexpected real-app-flow page occurrence contract for: {old_core}')
              core = core.replace(old_core, new_core)
          core_path.write_text(core, encoding='utf-8')

          actions_path = Path('/tmp/fichario-real-flow/check-real-app-actions.mjs')
          actions = actions_path.read_text(encoding='utf-8')
          replacements = [
              (
                  "const parentField = page.getByLabel('Dentro de', { exact: true });",
                  "const parentField = page.locator('form.new-notebook select');",
              ),
              (
                  "await page.getByLabel('Dentro de', { exact: true }).selectOption(notebook.id);",
                  "await page.locator('form.new-notebook select').selectOption(notebook.id);",
              ),
              (
                  "const correctionBox = page.getByLabel('Texto corrigido da página 1', { exact: true });",
                  "const transcriptTool = page.locator('details.transcript-tool');\n\tif ((await transcriptTool.getAttribute('open')) === null) await transcriptTool.locator('summary').click();\n\tconst correctionBox = page.getByLabel('Texto corrigido da página 1', { exact: true });",
              ),
              (
                  "const coverageInput = page.getByLabel('Conteúdos', { exact: true });",
                  "const coverageInput = page.getByRole('textbox', { name: 'Conteúdos', exact: true });",
              ),
          ]
          for old, new in replacements:
              if actions.count(old) != 1:
                  raise SystemExit(f'unexpected real-app-actions contract for: {old}')
              actions = actions.replace(old, new)

          old_failed_setup = """\tawait page.route('https://www.googleapis.com/upload/drive/v3/files**', async (route) => {
          \t\tif (route.request().method() === 'POST') await route.abort('failed');
          \t\telse await route.continue();
          \t});
          \tawait page
          \t\t.locator('input[type=\"file\"][accept*=\"application/pdf\"]')
          \t\t.first()
          \t\t.setInputFiles({
          \t\t\tname: failedFilename,
          \t\t\tmimeType: 'application/pdf',
          \t\t\tbuffer: await makePdf({ padded: false })
          \t\t});
          """
          new_failed_setup = """\tawait page
          \t\t.locator('input[type=\"file\"][accept*=\"application/pdf\"]')
          \t\t.first()
          \t\t.setInputFiles({
          \t\t\tname: failedFilename,
          \t\t\tmimeType: 'application/pdf',
          \t\t\tbuffer: Buffer.from('%PDF-1.7\\n% intentionally truncated real-flow failure fixture\\n')
          \t\t});
          """
          if actions.count(old_failed_setup) != 1:
              raise SystemExit('unexpected real-app-actions failed-import setup contract')
          actions = actions.replace(old_failed_setup, new_failed_setup)
          old_unroute = "\tawait page.unroute('https://www.googleapis.com/upload/drive/v3/files**');\n"
          if actions.count(old_unroute) != 1:
              raise SystemExit('unexpected real-app-actions failed-import cleanup contract')
          actions = actions.replace(old_unroute, '')
          actions_path.write_text(actions, encoding='utf-8')

          exhaustive_path = Path('/tmp/fichario-real-flow/check-real-app-exhaustive.mjs')
          exhaustive = exhaustive_path.read_text(encoding='utf-8')
          queue_heading_old = "['/settings/computers/queue/', 'Fila desktop']"
          queue_heading_new = "['/settings/computers/queue/', 'Fila de leitura']"
          if exhaustive.count(queue_heading_old) != 1:
              raise SystemExit('unexpected exhaustive desktop queue heading contract')
          exhaustive = exhaustive.replace(queue_heading_old, queue_heading_new)
          old = """\tpage.once('dialog', (dialog) => dialog.accept(renamedTagName));
          \tawait page.getByRole('button', { name: 'Renomear', exact: true }).click();
          \tawait page
          \t\t.getByText('Tag renomeada.', { exact: true })
          \t\t.waitFor({ state: 'visible', timeout: 20_000 });
          \tawait page
          \t\t.getByText(renamedTagName, { exact: true })
          \t\t.first()
          \t\t.waitFor({ state: 'visible', timeout: 20_000 });
          \tpage.once('dialog', (dialog) => dialog.accept());
          \tawait page.getByRole('button', { name: 'Excluir', exact: true }).click();
          \tawait page
          \t\t.getByText('Tag excluída.', { exact: true })
          \t\t.waitFor({ state: 'visible', timeout: 20_000 });
          """
          new = """\tawait page.getByRole('button', { name: 'Renomear', exact: true }).click();
          \tconst renameDialog = page.locator('form.dialog').filter({ hasText: 'Renomear tag' });
          \tawait renameDialog.getByLabel('Novo nome', { exact: true }).fill(renamedTagName);
          \tawait renameDialog.getByRole('button', { name: 'Renomear', exact: true }).click();
          \tawait page
          \t\t.getByText('Tag renomeada.', { exact: true })
          \t\t.waitFor({ state: 'visible', timeout: 20_000 });
          \tawait page
          \t\t.getByText(renamedTagName, { exact: true })
          \t\t.first()
          \t\t.waitFor({ state: 'visible', timeout: 20_000 });
          \tawait page.getByRole('button', { name: 'Excluir', exact: true }).click();
          \tconst deleteDialog = page.getByRole('alertdialog', { name: 'Excluir tag?' });
          \tawait deleteDialog.getByRole('button', { name: 'Excluir', exact: true }).click();
          \tawait page
          \t\t.getByText('Tag excluída.', { exact: true })
          \t\t.waitFor({ state: 'visible', timeout: 20_000 });
          """
          if exhaustive.count(old) != 1:
              raise SystemExit('unexpected exhaustive tag-dialog contract')
          exhaustive = exhaustive.replace(old, new)
          draft_replacements = [
              (
                  "const correctionEditor = page.getByLabel('Texto corrigido da página 1', { exact: true });",
                  "const draftTranscriptTool = page.locator('details.transcript-tool');\n\tif ((await draftTranscriptTool.getAttribute('open')) === null) await draftTranscriptTool.locator('summary').click();\n\tconst correctionEditor = page.getByLabel('Texto corrigido da página 1', { exact: true });",
              ),
              (
                  "const resumedEditor = page.getByLabel('Texto corrigido da página 1', { exact: true });",
                  "const resumedTranscriptTool = page.locator('details.transcript-tool');\n\tif ((await resumedTranscriptTool.getAttribute('open')) === null) await resumedTranscriptTool.locator('summary').click();\n\tconst resumedEditor = page.getByLabel('Texto corrigido da página 1', { exact: true });",
              ),
              (
                  "page.once('dialog', (dialog) => dialog.accept());\n\tawait draftRow.getByRole('button', { name: 'Descartar local', exact: true }).click();",
                  "await draftRow.getByRole('button', { name: 'Descartar local', exact: true }).click();\n\tconst discardDialog = page.getByRole('alertdialog', { name: 'Descartar rascunho local?' });\n\tawait discardDialog.getByRole('button', { name: 'Descartar', exact: true }).click();",
              ),
          ]
          for old_draft, new_draft in draft_replacements:
              if exhaustive.count(old_draft) != 1:
                  raise SystemExit(f'unexpected exhaustive draft contract for: {old_draft}')
              exhaustive = exhaustive.replace(old_draft, new_draft)

          old_fuzzy = """\tconst fuzzyResult = page
          \t\t.locator('section.results li')
          \t\t.filter({ hasText: organizedTitle })
          \t\t.first();
          \tawait fuzzyResult.waitFor({ state: 'visible', timeout: 45_000 });
          \tawait fuzzyResult.locator('a').click();
          """
          new_fuzzy = """\tconst fuzzyResult = page
          \t\t.locator(`section.results a[href^=\"/documents/${imported.id}/\"]`)
          \t\t.first();
          \tawait fuzzyResult.waitFor({ state: 'visible', timeout: 45_000 });
          \tawait fuzzyResult.locator('img').first().waitFor({ state: 'visible', timeout: 45_000 });
          \tawait fuzzyResult.click();
          """
          if exhaustive.count(old_fuzzy) != 1:
              raise SystemExit('unexpected exhaustive fuzzy-search result contract')
          exhaustive = exhaustive.replace(old_fuzzy, new_fuzzy)
          exhaustive_path.write_text(exhaustive, encoding='utf-8')
          PY

          node --check /tmp/fichario-real-flow/check-real-app-flows.mjs
          node --check /tmp/fichario-real-flow/check-real-app-actions.mjs
          node --check /tmp/fichario-real-flow/check-real-app-exhaustive.mjs
          node --check /tmp/fichario-real-flow/check-real-app-special-routes.mjs
          node --check /tmp/fichario-real-flow/check-real-scanned-pdf-import.mjs

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.16.0

      - name: Install pinned real-flow runtime
        working-directory: /tmp/fichario-real-flow
        run: >-
          npm install --no-save --package-lock=false
          playwright@1.62.1
          @supabase/supabase-js@2.57.4
          pdf-lib@1.17.1

      - name: Install Chromium
        working-directory: /tmp/fichario-real-flow
        run: npx playwright install --with-deps chromium

      - name: Exercise real deployed core flows
        id: core-flows
        continue-on-error: true
        working-directory: /tmp/fichario-real-flow
        run: node check-real-app-flows.mjs

      - name: Exercise real deployed feature actions
        id: feature-actions
        continue-on-error: true
        working-directory: /tmp/fichario-real-flow
        run: node check-real-app-actions.mjs

      - name: Exercise exhaustive deployed feature flows
        id: exhaustive-flows
        continue-on-error: true
        working-directory: /tmp/fichario-real-flow
        run: node check-real-app-exhaustive.mjs

      - name: Exercise special import entry routes
        id: special-routes
        continue-on-error: true
        working-directory: /tmp/fichario-real-flow
        run: node check-real-app-special-routes.mjs

      - name: Exercise deployed scanned PDF pipeline
        id: scanned-pdf
        continue-on-error: true
        working-directory: /tmp/fichario-real-flow
        run: node check-real-scanned-pdf-import.mjs

      - name: Upload sanitized real-flow evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-app-flow-${{ env.TARGET_SHA }}
          path: |
            /tmp/real-app-flow-report.json
            /tmp/real-app-flow-evidence/
            /tmp/real-app-action-report.json
            /tmp/real-app-action-evidence/
            /tmp/real-app-exhaustive-report.json
            /tmp/real-app-exhaustive-evidence/
            /tmp/real-app-special-report.json
            /tmp/real-app-special-evidence/
            /tmp/real-scanned-pdf-import-report.json
            /tmp/real-scanned-pdf-import-evidence/
          if-no-files-found: error
          compression-level: 6
          retention-days: 7

      - name: Reject any real-flow failure
        if: always()
        shell: bash
        env:
          CORE_OUTCOME: ${{ steps.core-flows.outcome }}
          ACTION_OUTCOME: ${{ steps.feature-actions.outcome }}
          EXHAUSTIVE_OUTCOME: ${{ steps.exhaustive-flows.outcome }}
          SPECIAL_OUTCOME: ${{ steps.special-routes.outcome }}
          SCANNED_PDF_OUTCOME: ${{ steps.scanned-pdf.outcome }}
        run: |
          set -euo pipefail
          test "$CORE_OUTCOME" = success
          test "$ACTION_OUTCOME" = success
          test "$EXHAUSTIVE_OUTCOME" = success
          test "$SPECIAL_OUTCOME" = success
          test "$SCANNED_PDF_OUTCOME" = success
          node --input-type=module - <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile(process.env.REAL_SCANNED_PDF_REPORT_PATH, 'utf8'));
          if (report.status !== 'pass') throw new Error(`scanned PDF report status is ${report.status}`);
          if (report.cleanup?.documents !== 'pass') throw new Error('scanned PDF document cleanup did not pass');
          if (report.cleanup?.importSessions !== 'pass') throw new Error('scanned PDF import-session cleanup did not pass');
          NODE

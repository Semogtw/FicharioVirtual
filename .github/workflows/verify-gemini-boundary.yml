name: Verify Gemini boundary staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-contract-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    env:
      GEMINI_BOUNDARY_REPORT_PATH: /tmp/gemini-boundary-report.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compare direct Gemini and process-ocr paths
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_AUTHORIZED_EMAIL: ${{ secrets.STAGING_AUTHORIZED_EMAIL }}
          STAGING_AUTHORIZED_PASSWORD: ${{ secrets.STAGING_AUTHORIZED_PASSWORD }}
          STAGING_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
        run: pnpm test:staging:gemini-boundary

      - name: Upload sanitized Gemini boundary report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-boundary-report-${{ github.run_id }}
          path: /tmp/gemini-boundary-report.json
          if-no-files-found: error
          retention-days: 2

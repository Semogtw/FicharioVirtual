name: Apply staging auth isolation

on:
  push:
    branches: [fix/staging-auth-isolation]
    paths:
      - .github/workflows/apply-staging-auth-isolation.yml

permissions:
  contents: write

concurrency:
  group: apply-staging-auth-isolation
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/staging-auth-isolation
          fetch-depth: 0
          persist-credentials: true

      - name: Patch shared staging auth behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          for path in Path('tools/checks').glob('*.mjs'):
              text = path.read_text()
              updated = text.replace(".auth.signOut()", ".auth.signOut({ scope: 'local' })")
              if updated != text:
                  path.write_text(updated)

          path = Path('tools/checks/check-visual-semantic-staging.mjs')
          text = path.read_text()

          marker = """async function login(db) {
\tconst result = await db.auth.signInWithPassword({
\t\temail: env('STAGING_AUTHORIZED_EMAIL'),
\t\tpassword: env('STAGING_AUTHORIZED_PASSWORD')
\t});
\tif (result.error || !result.data.user)
\t\tthrow new Error(`Sign-in failed: ${result.error?.message ?? 'no user'}`);
\tconst allowed = await db.rpc('is_authorized_user');
\tif (allowed.error || allowed.data !== true) throw new Error('Staging user is not authorized');
\treturn result.data.user;
}
"""
          replacement = marker + """
function functionErrorStatus(error) {
\tconst context = error && typeof error === 'object' ? error.context : null;
\treturn context instanceof Response ? context.status : null;
}

async function recoverAuthentication(db, error) {
\tif (functionErrorStatus(error) !== 401) return false;
\tawait login(db);
\treturn true;
}
"""
          if marker not in text:
              raise SystemExit('login marker not found')
          text = text.replace(marker, replacement, 1)

          old_search_header = """async function searches(db, state, expectedMode) {
\tconst labels = new Map(state.probes.map((p) => [p.documentId, p.id]));
\tconst rows = [];
"""
          new_search_header = """async function searches(db, state, expectedMode) {
\tconst labels = new Map(state.probes.map((p) => [p.documentId, p.id]));
\tconst rows = [];
\t// Staging checks share one account. Renew immediately before the long search
\t// phase so an earlier smoke cannot leave this runner with a revoked session.
\tawait login(db);
"""
          if old_search_header not in text:
              raise SystemExit('search header not found')
          text = text.replace(old_search_header, new_search_header, 1)

          old_retry = """\t\tfor (const delay of [0, 5_000, 15_000]) {
\t\t\tif (delay) {
\t\t\t\tretryCount += 1;
\t\t\t\tawait sleep(delay);
\t\t\t}
\t\t\tresult = await db.functions.invoke('semantic-search', {
\t\t\t\tbody: { query: spec.query, notebookId: state.notebookId, limit: 15, offset: 0 }
\t\t\t});
\t\t\tif (!result.error && Array.isArray(result.data?.results)) break;
\t\t}
"""
          new_retry = """\t\tfor (const delay of [0, 2_000, 5_000, 15_000]) {
\t\t\tif (delay) {
\t\t\t\tretryCount += 1;
\t\t\t\tawait sleep(delay);
\t\t\t}
\t\t\tresult = await db.functions.invoke('semantic-search', {
\t\t\t\tbody: { query: spec.query, notebookId: state.notebookId, limit: 15, offset: 0 }
\t\t\t});
\t\t\tif (!result.error && Array.isArray(result.data?.results)) break;
\t\t\tif (result.error) await recoverAuthentication(db, result.error);
\t\t}
"""
          if old_retry not in text:
              raise SystemExit('search retry block not found')
          text = text.replace(old_retry, new_retry, 1)

          old_cleanup = """async function cleanup(db, statePath, reportPath) {
\tconst state = JSON.parse(await readFile(statePath, 'utf8'));
\tlet count = 0;
\tfor (const probe of [...(state.probes ?? []), ...(state.jpegSmoke ? [state.jpegSmoke] : [])]) {
\t\tconst result = await db.functions.invoke('delete-document', {
\t\t\tbody: { documentId: probe.documentId }
\t\t});
\t\tif (result.error) throw new Error(`Cleanup ${probe.id} failed: ${result.error.message}`);
\t\tcount += 1;
\t}
\tconst notebook = await db.from('notebooks').delete().eq('id', state.notebookId);
\tif (notebook.error) throw new Error(`Notebook cleanup failed: ${notebook.error.message}`);
\tawait writeFile(
\t\treportPath,
\t\tJSON.stringify({ status: 'pass', documentsDeleted: count, notebookDeleted: true }, null, 2)
\t);
\tconsole.log(`PASS cleanup ${count} documents`);
}
"""
          new_cleanup = """async function cleanup(db, statePath, reportPath) {
\tconst state = JSON.parse(await readFile(statePath, 'utf8'));
\tconst probes = [...(state.probes ?? []), ...(state.jpegSmoke ? [state.jpegSmoke] : [])];
\tconst failures = [];
\tlet count = 0;

\tawait login(db);
\tfor (const probe of probes) {
\t\tlet deleted = false;
\t\tlet lastError = null;
\t\tfor (const delay of [0, 500, 1_500, 4_000]) {
\t\t\tif (delay) await sleep(delay);
\t\t\tconst result = await db.functions.invoke('delete-document', {
\t\t\t\tbody: { documentId: probe.documentId }
\t\t\t});
\t\t\tif (!result.error) {
\t\t\t\tdeleted = true;
\t\t\t\tcount += 1;
\t\t\t\tbreak;
\t\t\t}
\t\t\tlastError = result.error;
\t\t\tawait recoverAuthentication(db, result.error);
\t\t}
\t\tif (!deleted) {
\t\t\tfailures.push({
\t\t\t\tid: probe.id,
\t\t\t\tdocumentId: probe.documentId,
\t\t\t\tstatus: functionErrorStatus(lastError),
\t\t\t\tmessage: lastError?.message ?? 'unknown cleanup error'
\t\t\t});
\t\t}
\t}

\tlet notebookDeleted = false;
\tif (failures.length === 0 && state.notebookId) {
\t\tconst notebook = await db.from('notebooks').delete().eq('id', state.notebookId);
\t\tif (notebook.error) failures.push({ id: 'notebook', message: notebook.error.message });
\t\telse notebookDeleted = true;
\t}

\tconst report = {
\t\tstatus: failures.length === 0 ? 'pass' : 'partial',
\t\tdocumentsDeleted: count,
\t\tdocumentsAttempted: probes.length,
\t\tnotebookDeleted,
\t\tfailures
\t};
\tawait writeFile(reportPath, JSON.stringify(report, null, 2));
\tif (failures.length > 0)
\t\tthrow new Error(`Cleanup incomplete: ${failures.map((failure) => failure.id).join(', ')}`);
\tconsole.log(`PASS cleanup ${count} documents`);
}
"""
          if old_cleanup not in text:
              raise SystemExit('cleanup block not found')
          text = text.replace(old_cleanup, new_cleanup, 1)
          path.write_text(text)

          test_path = Path('tests/unit/tooling/staging-auth-isolation.test.ts')
          test_path.write_text("""import { readFileSync, readdirSync } from 'node:fs';
import { describe, expect, it } from 'vitest';

describe('staging auth isolation', () => {
\tit('never globally signs out the shared staging account from check scripts', () => {
\t\tconst files = readdirSync('tools/checks').filter((name) => name.endsWith('.mjs'));
\t\tfor (const name of files) {
\t\t\tconst source = readFileSync(`tools/checks/${name}`, 'utf8');
\t\t\texpect(source, name).not.toContain('.auth.signOut()');
\t\t\tif (source.includes('.auth.signOut(')) {
\t\t\t\texpect(source, name).toContain(".auth.signOut({ scope: 'local' })");
\t\t\t}
\t\t}
\t});
});
""")
          PY

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and validate auth isolation
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write tools/checks tests/unit/tooling/staging-auth-isolation.test.ts
          pnpm lint
          pnpm check
          pnpm vitest run tests/unit/tooling/staging-auth-isolation.test.ts
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-staging-auth-isolation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(test): isolate shared staging auth sessions'
          git push origin HEAD:fix/staging-auth-isolation

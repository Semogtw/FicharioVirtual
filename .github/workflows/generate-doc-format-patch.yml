name: Generate review formatting patch once

on:
  workflow_run:
    workflows: [Validate current head, Validate documentation]
    types: [completed]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generate a deterministic repository formatting patch
        run: |
          pnpm exec prettier --write .
          git diff --binary > /tmp/review-format.patch
          test -s /tmp/review-format.patch
      - uses: actions/upload-artifact@v4
        with:
          name: review-format-${{ github.sha }}
          path: /tmp/review-format.patch
          if-no-files-found: error
          retention-days: 1

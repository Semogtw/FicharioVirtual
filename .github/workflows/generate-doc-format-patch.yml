name: Generate documentation formatting patch once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/generate-doc-format-patch.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Format the known failing documents
        run: |
          pnpm exec prettier --write \
            docs/DESKTOP_OCR_WORKER.md \
            docs/READINESS.md \
            docs/superpowers/plans/2026-08-06-provider-only-ocr-and-large-pdf-implementation.md
          git diff --binary -- \
            docs/DESKTOP_OCR_WORKER.md \
            docs/READINESS.md \
            docs/superpowers/plans/2026-08-06-provider-only-ocr-and-large-pdf-implementation.md \
            > /tmp/documentation-format.patch
          test -s /tmp/documentation-format.patch
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-format-${{ github.sha }}
          path: /tmp/documentation-format.patch
          if-no-files-found: error
          retention-days: 1

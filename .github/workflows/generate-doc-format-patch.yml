name: Generate review formatting patch once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/generate-doc-format-patch.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Format known failures and current review files
        run: |
          pnpm exec prettier --write \
            docs/CURRENT_STATUS.md \
            docs/DEPLOYMENT.md \
            docs/DESKTOP_OCR_WORKER.md \
            docs/READINESS.md \
            docs/superpowers/plans/2026-08-06-provider-only-ocr-and-large-pdf-implementation.md \
            src/lib/env/private.ts \
            tests/unit/drive/job-runner-edge.test.ts \
            tests/unit/tooling/current-head-workflow.test.ts \
            tests/unit/tooling/deployment-edge-functions.test.ts \
            tests/unit/tooling/drive-edge-security-gate.test.ts \
            tests/unit/tooling/supabase-config.test.ts \
            tests/unit/tooling/workflow-permissions.test.ts \
            tools/checks/check-source-security.mjs
          git diff --binary -- \
            docs/CURRENT_STATUS.md \
            docs/DEPLOYMENT.md \
            docs/DESKTOP_OCR_WORKER.md \
            docs/READINESS.md \
            docs/superpowers/plans/2026-08-06-provider-only-ocr-and-large-pdf-implementation.md \
            src/lib/env/private.ts \
            tests/unit/drive/job-runner-edge.test.ts \
            tests/unit/tooling/current-head-workflow.test.ts \
            tests/unit/tooling/deployment-edge-functions.test.ts \
            tests/unit/tooling/drive-edge-security-gate.test.ts \
            tests/unit/tooling/supabase-config.test.ts \
            tests/unit/tooling/workflow-permissions.test.ts \
            tools/checks/check-source-security.mjs \
            > /tmp/review-format.patch
          test -s /tmp/review-format.patch
      - uses: actions/upload-artifact@v4
        with:
          name: review-format-${{ github.sha }}
          path: /tmp/review-format.patch
          if-no-files-found: error
          retention-days: 1

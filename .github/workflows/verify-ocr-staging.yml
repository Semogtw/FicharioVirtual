name: Verify OCR staging

on:
  workflow_dispatch:
    inputs:
      confirm_external_ocr:
        description: Confirm one synthetic image may be sent to the configured OCR provider
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-ocr-staging
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Require explicit OCR confirmation
        env:
          CONFIRM_EXTERNAL_OCR: ${{ inputs.confirm_external_ocr }}
        run: test "$CONFIRM_EXTERNAL_OCR" = "true"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify real OCR with a synthetic image
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_AUTHORIZED_EMAIL: ${{ secrets.STAGING_AUTHORIZED_EMAIL }}
          STAGING_AUTHORIZED_PASSWORD: ${{ secrets.STAGING_AUTHORIZED_PASSWORD }}
        run: pnpm test:staging:ocr

name: Format visual Deno fixes

on:
  push:
    branches: [feat/adaptive-visual-embeddings]
    paths:
      - .github/workflows/format-visual-deno.yml
      - .ci/visual-deno/**

permissions:
  contents: write

concurrency:
  group: format-visual-deno
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/adaptive-visual-embeddings
          fetch-depth: 0
          persist-credentials: true

      - name: Apply verified Deno patch
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/visual-deno/part-* > /tmp/visual-deno.patch
          git apply --check /tmp/visual-deno.patch
          git apply /tmp/visual-deno.patch

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format patched files
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write supabase/functions/_shared/background-visual-indexer.ts supabase/functions/semantic-search/index.ts
          git diff --check
          pnpm check

      - name: Commit fixes and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci/visual-deno .github/workflows/format-visual-deno.yml .github/workflows/fix-visual-deno.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(search): satisfy Deno visual worker types'
          git push origin HEAD:feat/adaptive-visual-embeddings

name: Validate library open fast path

on:
  pull_request:
    branches: [main]
    paths:
      - src/lib/components/DocumentCard.svelte
      - src/lib/components/DocumentMediaViewer.svelte
      - src/lib/drive/browser-download.ts
      - src/lib/services/document-detail.ts
      - supabase/functions/drive-media/index.ts
      - tests/unit/drive/browser-download.test.ts
      - tests/unit/routes/document-original-reference.test.ts
      - tests/unit/services/document-detail.test.ts
      - .github/workflows/validate-library-open-fast-path.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused unit tests
        run: >-
          pnpm exec vitest run
          tests/unit/drive/browser-download.test.ts
          tests/unit/routes/document-original-reference.test.ts
          tests/unit/services/document-detail.test.ts

      - name: Format validation workspace
        run: |
          pnpm exec prettier --write \
            supabase/functions/drive-media/index.ts \
            tests/unit/drive/browser-download.test.ts \
            tools/checks/check-deployed-ui.mjs
          git diff -- \
            supabase/functions/drive-media/index.ts \
            tests/unit/drive/browser-download.test.ts \
            tools/checks/check-deployed-ui.mjs

      - name: Run frontend verification
        run: pnpm verify

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: 2.8.1

      - name: Check Edge Functions
        run: pnpm test:functions:check

name: Stabilize Drive conflicts once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stabilize-drive-conflicts.yml

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Integrate conflict resolution
        run: |
          python - <<'PY'
          from pathlib import Path

          test = Path('supabase/tests/drive_conflict_resolution.sql')
          test.write_text(test.read_text().replace('select plan(20);', 'select plan(19);'))

          layout = Path('src/routes/drive/+layout.svelte')
          content = layout.read_text()
          marker = '\t<a href="/drive/jobs/">Mudanças locais</a>\n'
          addition = '\t<a href="/drive/conflicts/">Conflitos</a>\n'
          if addition not in content:
              if marker in content:
                  content = content.replace(marker, marker + addition)
              else:
                  content = content.replace(
                      '\t<a href="/drive/">Recuperação</a>\n',
                      '\t<a href="/drive/">Recuperação</a>\n' + addition,
                  )
          layout.write_text(content)
          PY
      - name: Format conflict resolution block
        run: |
          pnpm exec prettier --write \
            src/lib/services/drive-conflicts.ts \
            src/routes/drive/+layout.svelte \
            src/routes/drive/conflicts/+page.svelte \
            supabase/migrations/202608060013_resolve_drive_conflicts.sql \
            supabase/tests/drive_conflict_resolution.sql \
            tests/unit/services/drive-conflicts.test.ts \
            tests/unit/routes/drive-conflicts-page.test.ts
      - name: Commit and remove this workflow
        run: |
          rm -f .github/workflows/stabilize-drive-conflicts.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: integrate Google Drive conflict resolution'
          git push origin HEAD:main

name: Format staging gates

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/format-staging-gates.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Format staging and deployment gates
        run: |
          pnpm exec prettier --write \
            tools/checks/deployment-contract.mjs \
            tests/unit/tooling/deployment-contract.test.ts \
            tools/checks/supabase-staging-contract.mjs \
            tools/checks/check-supabase-staging.mjs \
            tests/unit/tooling/supabase-staging-contract.test.ts \
            tests/unit/tooling/supabase-staging-workflow.test.ts \
            .github/workflows/verify-supabase-staging.yml \
            docs/SUPABASE_STAGING.md
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No formatting changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/checks/deployment-contract.mjs \
            tests/unit/tooling/deployment-contract.test.ts \
            tools/checks/supabase-staging-contract.mjs \
            tools/checks/check-supabase-staging.mjs \
            tests/unit/tooling/supabase-staging-contract.test.ts \
            tests/unit/tooling/supabase-staging-workflow.test.ts \
            .github/workflows/verify-supabase-staging.yml \
            docs/SUPABASE_STAGING.md
          git commit -m 'style: format staging verification gates'
          git push origin HEAD:main

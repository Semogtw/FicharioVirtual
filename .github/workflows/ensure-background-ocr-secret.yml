name: Ensure background OCR worker secret

on:
  workflow_run:
    workflows: [Deploy Supabase staging]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: background-ocr-secret-staging
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging-deploy
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      SYNC_WORKDIR: /tmp/fichario-background-ocr-secret

    steps:
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: 2.111.0

      - name: Validate protected staging configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$STAGING_SUPABASE_PROJECT_REF"

      - name: Initialize isolated linked project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SYNC_WORKDIR"
          mkdir -p "$SYNC_WORKDIR"
          cd "$SYNC_WORKDIR"
          supabase init
          supabase link --project-ref "$STAGING_SUPABASE_PROJECT_REF"

      - name: Rotate and synchronize worker credential
        id: credential
        shell: bash
        run: |
          set -euo pipefail
          cd "$SYNC_WORKDIR"
          worker_key="$(openssl rand -hex 32)"
          project_url="https://${STAGING_SUPABASE_PROJECT_REF}.supabase.co"
          echo "::add-mask::$worker_key"

          sql_file="$(mktemp "$SYNC_WORKDIR/worker-secret.XXXXXX.sql")"
          env_file="$(mktemp "$SYNC_WORKDIR/edge-secret.XXXXXX.env")"
          chmod 600 "$sql_file" "$env_file"
          cleanup() {
            command -v shred >/dev/null 2>&1 && shred -u "$sql_file" "$env_file" || rm -f "$sql_file" "$env_file"
          }
          trap cleanup EXIT

          cat > "$sql_file" <<SQL
          do \$sync\$
          declare
            project_secret_id uuid;
            worker_secret_id uuid;
          begin
            select id into project_secret_id
            from vault.decrypted_secrets
            where name = 'project_url'
            order by created_at desc
            limit 1;

            if project_secret_id is null then
              perform vault.create_secret(
                '$project_url',
                'project_url',
                'Fichário background OCR project URL'
              );
            else
              perform vault.update_secret(
                project_secret_id,
                '$project_url',
                'project_url',
                'Fichário background OCR project URL'
              );
            end if;

            select id into worker_secret_id
            from vault.decrypted_secrets
            where name = 'ocr_background_worker_key'
            order by created_at desc
            limit 1;

            if worker_secret_id is null then
              perform vault.create_secret(
                '$worker_key',
                'ocr_background_worker_key',
                'Fichário internal background OCR worker credential'
              );
            else
              perform vault.update_secret(
                worker_secret_id,
                '$worker_key',
                'ocr_background_worker_key',
                'Fichário internal background OCR worker credential'
              );
            end if;
          end
          \$sync\$;
          SQL

          supabase db query --linked --agent yes -f "$sql_file" >/dev/null
          printf 'OCR_BACKGROUND_WORKER_KEY=%s\n' "$worker_key" > "$env_file"
          supabase secrets set --project-ref "$STAGING_SUPABASE_PROJECT_REF" --env-file "$env_file" >/dev/null

          if ! supabase secrets list --project-ref "$STAGING_SUPABASE_PROJECT_REF" | grep -q 'OCR_BACKGROUND_WORKER_KEY'; then
            echo 'background OCR Edge Function credential was not provisioned' >&2
            exit 1
          fi

          echo "worker_key=$worker_key" >> "$GITHUB_OUTPUT"
          echo "project_url=$project_url" >> "$GITHUB_OUTPUT"

      - name: Verify real worker wake-up
        shell: bash
        env:
          WORKER_KEY: ${{ steps.credential.outputs.worker_key }}
          PROJECT_URL: ${{ steps.credential.outputs.project_url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$WORKER_KEY"
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT
          status="$(
            curl --silent --show-error \
              --output "$body_file" \
              --write-out '%{http_code}' \
              --request POST \
              --header 'Content-Type: application/json' \
              --header "X-Fichario-Worker-Key: $WORKER_KEY" \
              --data '{"source":"deployment-secret-sync"}' \
              "$PROJECT_URL/functions/v1/ocr-queue-worker"
          )"
          if [ "$status" != '202' ]; then
            echo "background OCR worker wake-up returned HTTP $status" >&2
            exit 1
          fi
          echo 'Background OCR worker credential and wake-up: PASS'

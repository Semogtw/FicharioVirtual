name: Native mechanical checkpoint

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/native-mechanical-checkpoint.yml
      - src-tauri/**

permissions:
  contents: write

jobs:
  checkpoint:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout native branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Ensure Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Canonicalize Rust and lock dependencies
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Commit mechanical checkpoint
        shell: bash
        run: |
          if git diff --quiet -- src-tauri; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri
          git commit -m "chore(native): canonicalize Rust and lock dependencies"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

name: Format visual benchmark final

on:
  push:
    branches: [feat/adaptive-visual-embeddings]
    paths:
      - .github/workflows/format-visual-benchmark-final.yml

permissions:
  contents: write

concurrency:
  group: format-visual-benchmark-final
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/adaptive-visual-embeddings
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and require full lint
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write tools/checks/check-visual-semantic-staging.mjs
          pnpm lint
          git diff --check

      - name: Commit formatting and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/format-visual-benchmark-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'style(search): format real visual staging benchmark'
          git push origin HEAD:feat/adaptive-visual-embeddings

name: Verify real scanned PDF import

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-scanned-pdf-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    env:
      TARGET_URL: https://fichario-virtual.pages.dev
      TARGET_SHA: ${{ github.sha }}
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      STAGING_AUTHORIZED_EMAIL: ${{ secrets.STAGING_AUTHORIZED_EMAIL }}
      STAGING_AUTHORIZED_PASSWORD: ${{ secrets.STAGING_AUTHORIZED_PASSWORD }}
      REAL_SCANNED_PDF_REPORT_PATH: /tmp/real-scanned-pdf-import-report.json
      REAL_SCANNED_PDF_EVIDENCE_DIR: /tmp/real-scanned-pdf-import-evidence
      PLAYWRIGHT_BROWSERS_PATH: /tmp/fichario-real-scanned-pdf-browsers

    steps:
      - name: Validate immutable test target
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$STAGING_SUPABASE_URL"
          test -n "$STAGING_SUPABASE_PUBLISHABLE_KEY"
          test -n "$STAGING_AUTHORIZED_EMAIL"
          test -n "$STAGING_AUTHORIZED_PASSWORD"

      - name: Fetch exact-SHA scanned-PDF verifier without checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fichario-real-scanned-pdf
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/Semogtw/FicharioVirtual/${TARGET_SHA}/tools/checks/check-real-scanned-pdf-import.mjs" \
            --output /tmp/fichario-real-scanned-pdf/check-real-scanned-pdf-import.mjs
          test -s /tmp/fichario-real-scanned-pdf/check-real-scanned-pdf-import.mjs
          printf '%s\n' '{"private":true,"type":"module"}' > /tmp/fichario-real-scanned-pdf/package.json
          node --check /tmp/fichario-real-scanned-pdf/check-real-scanned-pdf-import.mjs

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0

      - name: Install pinned real-flow runtime
        working-directory: /tmp/fichario-real-scanned-pdf
        run: >-
          npm install --no-save --package-lock=false
          playwright@1.62.1
          @supabase/supabase-js@2.57.4
          pdf-lib@1.17.1

      - name: Install Chromium
        working-directory: /tmp/fichario-real-scanned-pdf
        run: npx playwright install chromium

      - name: Exercise deployed scanned PDF pipeline
        id: scanned-pdf
        continue-on-error: true
        working-directory: /tmp/fichario-real-scanned-pdf
        run: node check-real-scanned-pdf-import.mjs

      - name: Upload sanitized scanned-PDF evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-scanned-pdf-${{ env.TARGET_SHA }}
          path: |
            /tmp/real-scanned-pdf-import-report.json
            /tmp/real-scanned-pdf-import-evidence/
          if-no-files-found: error
          compression-level: 6
          retention-days: 7

      - name: Reject any scanned-PDF flow failure
        if: always()
        shell: bash
        env:
          SCANNED_PDF_OUTCOME: ${{ steps.scanned-pdf.outcome }}
        run: |
          set -euo pipefail
          test "$SCANNED_PDF_OUTCOME" = success
          node --input-type=module - <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile(process.env.REAL_SCANNED_PDF_REPORT_PATH, 'utf8'));
          if (report.status !== 'pass') throw new Error(`scanned PDF report status is ${report.status}`);
          if (report.cleanup?.documents !== 'pass') throw new Error('document cleanup did not pass');
          if (report.cleanup?.importSessions !== 'pass') throw new Error('import-session cleanup did not pass');
          NODE

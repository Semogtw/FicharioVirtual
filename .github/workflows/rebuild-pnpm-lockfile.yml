name: Rebuild pnpm lockfile

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rebuild-pnpm-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: rebuild-pnpm-lockfile
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Publish running receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='[CI] Rebuild Fichário pnpm lockfile'
          issue_number="$(
            gh issue list --state all --limit 100 --json number,title \
              --jq '.[] | select(.title == "[CI] Rebuild Fichário pnpm lockfile") | .number' \
              | head -n 1
          )"
          cat > /tmp/receipt.md <<EOF
          Status: RUNNING
          Commit: ${{ github.sha }}
          Run ID: ${{ github.run_id }}
          Workflow: ${{ github.workflow }}
          EOF
          if [ -z "$issue_number" ]; then
            issue_url="$(gh issue create --title "$title" --body-file /tmp/receipt.md)"
            issue_number="${issue_url##*/}"
          else
            gh issue edit "$issue_number" --body-file /tmp/receipt.md
          fi
          echo "RECEIPT_ISSUE=$issue_number" >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.16.0

      - name: Generate and verify lockfile
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          test -s pnpm-lock.yaml
          pnpm install --frozen-lockfile --lockfile-only

      - name: Commit generated lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'pnpm-lock.yaml is already current.'
          else
            git commit -m 'chore: update pnpm lockfile for PWA integration'
            git push origin HEAD:main
          fi

      - name: Publish final receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${RECEIPT_ISSUE:-}" ]; then
            echo 'Receipt issue was not created.' >&2
            exit 1
          fi
          cat > /tmp/receipt.md <<EOF
          Status: ${{ job.status }}
          Commit: ${{ github.sha }}
          Run ID: ${{ github.run_id }}
          Workflow: ${{ github.workflow }}
          EOF
          gh issue edit "$RECEIPT_ISSUE" --body-file /tmp/receipt.md

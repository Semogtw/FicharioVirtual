name: Clean stale prelaunch fixtures
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  clean:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove stale launch fixtures
        run: |
          git fetch origin feat/background-import-queue
          git show origin/feat/background-import-queue:tests/unit/import/job-runner.test.ts > tests/unit/import/job-runner.test.ts
          python3 <<'PY'
          from pathlib import Path
          roots = [Path('src'), Path('tests')]
          for root in roots:
              for p in root.rglob('*'):
                  if not p.is_file() or p.suffix not in {'.ts', '.svelte'}:
                      continue
                  text = p.read_text()
                  old = text
                  text = text.replace('consentGranted: true,', '')
                  text = text.replace('consentGranted: false,', '')
                  text = text.replace('{ consentGranted: true }', '{}')
                  text = text.replace('{ consentGranted: false }', '{}')
                  text = text.replace("async () => ({ state: 'busy' })", "async () => ({ state: 'retry_later' })")
                  if text != old:
                      p.write_text(text)
          PY
          pnpm exec prettier --write .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'test: remove stale prelaunch fixtures'
          git push origin HEAD:main

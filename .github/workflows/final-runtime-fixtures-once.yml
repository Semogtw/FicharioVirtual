name: Apply final runtime fixture repairs once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply focused repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected fragment not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          unified = Path('src/lib/components/UnifiedImportPage.svelte')
          text = unified.read_text()
          focus_css = '''\n\t.file-button:focus-within,\n\t.camera-button:focus-within {\n\t\toutline: 0.1875rem solid var(--focus);\n\t\toutline-offset: 0.1875rem;\n\t}\n'''
          if '.file-button:focus-within' not in text:
              marker = '\n\t.file-button input,\n\t.camera-button input {'
              if marker not in text:
                  raise SystemExit('UnifiedImportPage focus CSS insertion point missing')
              unified.write_text(text.replace(marker, focus_css + marker, 1))

          replace(
              'src/lib/components/ImportQueueTray.svelte',
              '<span>{label(entry)}</span>',
              '<span role="status" aria-live="polite" aria-atomic="true">{label(entry)}</span>'
          )

          ollama = Path('tests/unit/desktop-worker/ollama-engine.test.ts')
          text = ollama.read_text()
          if 'wordGeometry: []' not in text.split('function chatContent', 1)[1].split('afterEach', 1)[0]:
              replace(
                  str(ollama),
                  "\t\tneedsReview: false,\n\t\t...overrides",
                  "\t\tneedsReview: false,\n\t\twordGeometry: [],\n\t\t...overrides"
              )

          spool = Path('tests/unit/desktop-worker/spool-retention.test.ts')
          text = spool.read_text()
          if 'wordGeometry: []' not in text:
              replace(
                  str(spool),
                  "\t\tneedsReview: false,\n\t\ttimingMs: 1000",
                  "\t\tneedsReview: false,\n\t\ttimingMs: 1000,\n\t\twordGeometry: []"
              )

          replace(
              'tests/unit/stores/import-queue-resume.test.ts',
              "storagePath: `${userId}/document/original.webp`,",
              "storagePath: 'drive:2AbCdEfGhIjKlMnOpQrStUvWxYz_123456',"
          )
          PY
          pnpm exec prettier --write src/lib/components/UnifiedImportPage.svelte src/lib/components/ImportQueueTray.svelte tests/unit/desktop-worker/ollama-engine.test.ts tests/unit/desktop-worker/spool-retention.test.ts tests/unit/stores/import-queue-resume.test.ts
          pnpm exec vitest run tests/unit/desktop-worker/ollama-engine.test.ts tests/unit/desktop-worker/spool-retention.test.ts tests/unit/stores/import-queue-resume.test.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: align final runtime accessibility and worker fixtures'
          git push origin HEAD:main

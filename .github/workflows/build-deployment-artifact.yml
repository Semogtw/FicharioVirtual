name: Build deployable Fichário staging artifact

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: build-fichario-staging
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    env:
      TARGET_ENVIRONMENT: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require green current-head validation for this SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          validation_run_id=''
          for attempt in $(seq 1 120); do
            main_sha="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
            if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
              echo "Refusing to build a stale/non-main artifact: workflow SHA=$GITHUB_SHA main SHA=$main_sha" >&2
              exit 1
            fi

            validation_run_id="$(
              gh api --paginate \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/validate-current-head.yml/runs?head_sha=${GITHUB_SHA}&per_page=100" \
                --jq ".workflow_runs[] | select(.head_sha == \"${GITHUB_SHA}\" and .head_branch == \"main\" and .event == \"push\" and .status == \"completed\" and .conclusion == \"success\") | .id" \
                | head -n 1
            )"
            if [[ -n "$validation_run_id" ]]; then
              break
            fi

            failed_run="$(
              gh api --paginate \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/validate-current-head.yml/runs?head_sha=${GITHUB_SHA}&per_page=100" \
                --jq ".workflow_runs[] | select(.head_sha == \"${GITHUB_SHA}\" and .head_branch == \"main\" and .event == \"push\" and .status == \"completed\" and .conclusion != \"success\") | [.id, .conclusion] | @tsv" \
                | head -n 1
            )"
            if [[ -n "$failed_run" ]]; then
              echo "Validate current head completed without success for $GITHUB_SHA: $failed_run" >&2
              exit 1
            fi

            sleep 5
          done

          if [[ -z "$validation_run_id" ]]; then
            echo "No successful Validate current head push run became available for main SHA $GITHUB_SHA." >&2
            exit 1
          fi

          echo "Using Validate current head run $validation_run_id for $GITHUB_SHA."

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate public deployment configuration
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.PUBLIC_GOOGLE_CLIENT_ID }}
          PUBLIC_GOOGLE_PICKER_API_KEY: ${{ secrets.PUBLIC_GOOGLE_PICKER_API_KEY }}
          PUBLIC_GOOGLE_CLOUD_PROJECT_NUMBER: ${{ secrets.PUBLIC_GOOGLE_CLOUD_PROJECT_NUMBER }}
        run: node tools/checks/check-staging-public-config.mjs

      - name: Verify and build static site
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.PUBLIC_GOOGLE_CLIENT_ID }}
          PUBLIC_GOOGLE_PICKER_API_KEY: ${{ secrets.PUBLIC_GOOGLE_PICKER_API_KEY }}
          PUBLIC_GOOGLE_CLOUD_PROJECT_NUMBER: ${{ secrets.PUBLIC_GOOGLE_CLOUD_PROJECT_NUMBER }}
        run: pnpm verify

      - name: Verify frozen public configuration
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.PUBLIC_GOOGLE_CLIENT_ID }}
          PUBLIC_GOOGLE_PICKER_API_KEY: ${{ secrets.PUBLIC_GOOGLE_PICKER_API_KEY }}
          PUBLIC_GOOGLE_CLOUD_PROJECT_NUMBER: ${{ secrets.PUBLIC_GOOGLE_CLOUD_PROJECT_NUMBER }}
        run: |
          set -euo pipefail
          grep -R -F -- "$PUBLIC_SUPABASE_URL" build >/dev/null
          grep -R -F -- "$PUBLIC_SUPABASE_PUBLISHABLE_KEY" build >/dev/null
          grep -R -F -- "$PUBLIC_GOOGLE_CLIENT_ID" build >/dev/null
          grep -R -F -- "$PUBLIC_GOOGLE_PICKER_API_KEY" build >/dev/null
          grep -R -F -- "$PUBLIC_GOOGLE_CLOUD_PROJECT_NUMBER" build >/dev/null
          ! grep -R -F '127.0.0.1:54321' build
          ! grep -R -F 'sb_publishable_test_key_1234567890' build

      - name: Package static artifact
        run: bash tools/deploy/package-static-artifact.sh fichario-deploy

      - name: Verify packaged deployment artifact
        run: pnpm test:deployment:artifact -- fichario-deploy

      - name: Upload deployable static artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fichario-static-${{ github.sha }}-staging
          path: fichario-deploy/
          if-no-files-found: error
          compression-level: 6
          retention-days: 7

name: Build deployable Fichário staging artifact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-fichario-staging
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    env:
      TARGET_ENVIRONMENT: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate public deployment configuration
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.PUBLIC_GOOGLE_CLIENT_ID }}
          PUBLIC_GOOGLE_PICKER_API_KEY: ${{ secrets.PUBLIC_GOOGLE_PICKER_API_KEY }}
          PUBLIC_GOOGLE_CLOUD_PROJECT_NUMBER: ${{ secrets.PUBLIC_GOOGLE_CLOUD_PROJECT_NUMBER }}
        run: |
          set -euo pipefail
          [[ "$TARGET_ENVIRONMENT" == 'staging' ]] || {
            echo 'this workflow is intentionally staging-only until production infrastructure exists' >&2
            exit 1
          }

          node <<'NODE'
          const urlValue = process.env.PUBLIC_SUPABASE_URL ?? '';
          const key = process.env.PUBLIC_SUPABASE_PUBLISHABLE_KEY ?? '';
          const url = new URL(urlValue);
          if (
            url.protocol !== 'https:' ||
            url.username ||
            url.password ||
            url.pathname !== '/' ||
            url.search ||
            url.hash
          ) {
            throw new Error('PUBLIC_SUPABASE_URL must be a credential-free HTTPS origin');
          }
          if (!key.startsWith('sb_publishable_') || key.length < 20 || key.length > 512) {
            throw new Error('PUBLIC_SUPABASE_PUBLISHABLE_KEY is invalid');
          }

          const clientId = (process.env.PUBLIC_GOOGLE_CLIENT_ID ?? '').trim();
          const pickerKey = (process.env.PUBLIC_GOOGLE_PICKER_API_KEY ?? '').trim();
          const projectNumber = (process.env.PUBLIC_GOOGLE_CLOUD_PROJECT_NUMBER ?? '').trim();
          const pickerValues = [clientId, pickerKey, projectNumber];
          const configuredPickerValues = pickerValues.filter(Boolean).length;
          if (configuredPickerValues !== 0 && configuredPickerValues !== pickerValues.length) {
            throw new Error('Google Picker public settings must be configured together');
          }
          if (configuredPickerValues === pickerValues.length) {
            if (!/^\d+-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$/.test(clientId)) {
              throw new Error('PUBLIC_GOOGLE_CLIENT_ID is invalid');
            }
            if (!/^AIza[A-Za-z0-9_-]+$/.test(pickerKey) || pickerKey.length > 256) {
              throw new Error('PUBLIC_GOOGLE_PICKER_API_KEY is invalid');
            }
            if (!/^\d{6,20}$/.test(projectNumber)) {
              throw new Error('PUBLIC_GOOGLE_CLOUD_PROJECT_NUMBER is invalid');
            }
          }
          NODE

      - name: Verify and build static site
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.PUBLIC_GOOGLE_CLIENT_ID }}
          PUBLIC_GOOGLE_PICKER_API_KEY: ${{ secrets.PUBLIC_GOOGLE_PICKER_API_KEY }}
          PUBLIC_GOOGLE_CLOUD_PROJECT_NUMBER: ${{ secrets.PUBLIC_GOOGLE_CLOUD_PROJECT_NUMBER }}
        run: pnpm verify

      - name: Verify frozen public configuration
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.PUBLIC_GOOGLE_CLIENT_ID }}
          PUBLIC_GOOGLE_PICKER_API_KEY: ${{ secrets.PUBLIC_GOOGLE_PICKER_API_KEY }}
          PUBLIC_GOOGLE_CLOUD_PROJECT_NUMBER: ${{ secrets.PUBLIC_GOOGLE_CLOUD_PROJECT_NUMBER }}
        run: |
          set -euo pipefail
          grep -R -F -- "$PUBLIC_SUPABASE_URL" build >/dev/null
          grep -R -F -- "$PUBLIC_SUPABASE_PUBLISHABLE_KEY" build >/dev/null
          if [[ -n "$PUBLIC_GOOGLE_CLIENT_ID" ]]; then
            grep -R -F -- "$PUBLIC_GOOGLE_CLIENT_ID" build >/dev/null
            grep -R -F -- "$PUBLIC_GOOGLE_PICKER_API_KEY" build >/dev/null
            grep -R -F -- "$PUBLIC_GOOGLE_CLOUD_PROJECT_NUMBER" build >/dev/null
          fi
          ! grep -R -F '127.0.0.1:54321' build
          ! grep -R -F 'sb_publishable_test_key_1234567890' build

      - name: Package static artifact
        run: |
          set -euo pipefail
          rm -rf fichario-deploy
          mkdir -p fichario-deploy/site fichario-deploy/source fichario-deploy/checks
          cp -a build/. fichario-deploy/site/
          cp package.json pnpm-lock.yaml fichario-deploy/source/
          cp \
            tools/checks/check-deployed-site.mjs \
            tools/checks/deployment-contract.mjs \
            tools/checks/validate-pages-deploy-output.mjs \
            fichario-deploy/checks/
          {
            echo 'schema_version=2'
            echo 'source_repository=Semogtw/FicharioVirtual'
            echo "source_commit=${GITHUB_SHA}"
            echo 'target_environment=staging'
            echo "created_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "node_version=$(node --version)"
            echo "pnpm_version=$(pnpm --version)"
            echo "package_sha256=$(sha256sum fichario-deploy/source/package.json | cut -d' ' -f1)"
            echo "lock_sha256=$(sha256sum fichario-deploy/source/pnpm-lock.yaml | cut -d' ' -f1)"
          } > fichario-deploy/DEPLOYMENT-MANIFEST.txt
          (
            cd fichario-deploy
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Verify packaged deployment artifact
        run: pnpm test:deployment:artifact -- fichario-deploy

      - name: Upload deployable static artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fichario-static-${{ github.sha }}-staging
          path: fichario-deploy/
          if-no-files-found: error
          compression-level: 6
          retention-days: 7

name: Validate native app

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/validate-native-app.yml
      - src-tauri/**
      - src/lib/native/**
      - src/lib/platform/native-bridge.ts
      - src/lib/drive/browser-download.ts
      - src/lib/pdf/upload.ts
      - src/lib/pdf/drive-upload.ts
      - src/lib/pdf/native-range-transport.ts
      - src/lib/import/drive-upload.ts
      - tests/unit/native/**
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Canonical formatting
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout native branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format frontend and docs
        run: pnpm exec prettier --write docs/native-app src/lib/native src/lib/platform/native-bridge.ts src/lib/drive/browser-download.ts src/lib/pdf/upload.ts src/lib/pdf/drive-upload.ts src/lib/pdf/native-range-transport.ts src/lib/import/drive-upload.ts tests/unit/native src-tauri/tauri.conf.json src-tauri/capabilities/default.json

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/native-app src/lib src-tauri tests/unit/native
          git commit -m "style(native): apply canonical formatting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  frontend:
    name: Frontend contracts
    needs: format
    if: ${{ always() && (needs.format.result == 'success' || needs.format.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run native bridge unit tests
        run: pnpm exec vitest run tests/unit/native

      - name: Run frontend verification
        run: pnpm verify

  rust-desktop:
    name: Rust ${{ matrix.os }}
    needs: format
    if: ${{ always() && (needs.format.result == 'success' || needs.format.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Linux WebView build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Ensure Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustc --version
          cargo --version

      - name: Generate Rust lockfile
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Preserve generated lockfile
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-cargo-lock-${{ github.sha }}
          path: src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 3

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Compile native shell
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

name: Format service validation changes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/format-service-validation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-service-validation
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format validation changes
        run: |
          pnpm exec prettier --write \
            src/lib/services/auth.ts \
            src/lib/services/ocr.ts \
            src/lib/services/review.ts \
            src/lib/services/tags.ts \
            tests/unit/services/auth.test.ts \
            tests/unit/services/ocr.test.ts \
            tests/unit/services/review.test.ts \
            tests/unit/services/tags.test.ts

      - name: Commit formatting when needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/lib/services/auth.ts \
            src/lib/services/ocr.ts \
            src/lib/services/review.ts \
            src/lib/services/tags.ts \
            tests/unit/services/auth.test.ts \
            tests/unit/services/ocr.test.ts \
            tests/unit/services/review.test.ts \
            tests/unit/services/tags.test.ts
          if git diff --cached --quiet; then
            echo 'Validation files are already formatted.'
          else
            git commit -m 'style: format service validation changes'
            git push origin HEAD:main
          fi

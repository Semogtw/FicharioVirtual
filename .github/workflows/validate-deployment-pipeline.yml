name: Validate deployment pipeline

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-deployment-artifact.yml
      - .github/workflows/deploy-cloudflare-pages.yml
      - .github/workflows/validate-deployment-pipeline.yml
      - package.json
      - pnpm-lock.yaml
      - svelte.config.js
      - static/**
      - tools/checks/check-artifact-reproducibility.mjs
      - tools/checks/check-built-pwa.mjs
      - tools/checks/check-cloudflare-deployment-workflow.mjs
      - tools/checks/check-deployed-site.mjs
      - tools/checks/check-deployment-artifact.mjs
      - tools/checks/check-deployment-artifact-workflow.mjs
      - tools/checks/deployment-contract.mjs
      - tools/checks/validate-pages-deploy-output.mjs
      - tools/deploy/**
      - tests/unit/tooling/deployment-artifact-contract.test.ts
      - tests/unit/tooling/deployment-contract.test.ts
      - tests/unit/tooling/pages-deploy-output.test.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-deployment-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_ENVIRONMENT: staging
      PUBLIC_SUPABASE_URL: https://ci-deploy-contract.supabase.co
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_deploy_contract_1234567890

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check deployment source formatting
        run: |
          pnpm exec prettier --check \
            .github/workflows/build-deployment-artifact.yml \
            .github/workflows/deploy-cloudflare-pages.yml \
            .github/workflows/validate-deployment-pipeline.yml \
            tools/checks/check-artifact-reproducibility.mjs \
            tools/checks/check-built-pwa.mjs \
            tools/checks/check-cloudflare-deployment-workflow.mjs \
            tools/checks/check-deployed-site.mjs \
            tools/checks/check-deployment-artifact.mjs \
            tools/checks/check-deployment-artifact-workflow.mjs \
            tools/checks/deployment-contract.mjs \
            tools/checks/validate-pages-deploy-output.mjs \
            tests/unit/tooling/deployment-artifact-contract.test.ts \
            tests/unit/tooling/deployment-contract.test.ts \
            tests/unit/tooling/pages-deploy-output.test.ts

      - name: Check deployment shell syntax
        run: bash -n tools/deploy/package-static-artifact.sh

      - name: Check deployment workflow boundaries
        run: |
          node tools/checks/check-workflow-security.mjs
          node tools/checks/check-cloudflare-deployment-workflow.mjs
          node tools/checks/check-deployment-artifact-workflow.mjs
          node tools/checks/check-artifact-reproducibility.mjs

      - name: Run deployment contract unit tests
        run: |
          pnpm exec vitest run \
            tests/unit/tooling/deployment-artifact-contract.test.ts \
            tests/unit/tooling/deployment-contract.test.ts \
            tests/unit/tooling/pages-deploy-output.test.ts

      - name: Build static site with non-deployable CI public config
        run: pnpm build

      - name: Verify emitted PWA and security headers again
        run: node tools/checks/check-built-pwa.mjs

      - name: Confirm CI-only public config is frozen in the test build
        run: |
          set -euo pipefail
          grep -R -F -- "$PUBLIC_SUPABASE_URL" build >/dev/null
          grep -R -F -- "$PUBLIC_SUPABASE_PUBLISHABLE_KEY" build >/dev/null

      - name: Package staging artifact twice
        run: |
          set -euo pipefail
          bash tools/deploy/package-static-artifact.sh fichario-deploy-ci-a
          bash tools/deploy/package-static-artifact.sh fichario-deploy-ci-b

      - name: Prove repeated packaging has identical identity
        run: |
          set -euo pipefail
          cmp fichario-deploy-ci-a/DEPLOYMENT-MANIFEST.txt fichario-deploy-ci-b/DEPLOYMENT-MANIFEST.txt
          cmp fichario-deploy-ci-a/SHA256SUMS fichario-deploy-ci-b/SHA256SUMS

      - name: Verify throwaway artifact from repository checker
        run: node tools/checks/check-deployment-artifact.mjs fichario-deploy-ci-a

      - name: Verify throwaway artifact from its bundled checker
        run: node fichario-deploy-ci-a/checks/check-deployment-artifact.mjs fichario-deploy-ci-a

      - name: Confirm throwaway artifact cannot masquerade as production
        run: |
          set -euo pipefail
          grep -Fx 'target_environment=staging' fichario-deploy-ci-a/DEPLOYMENT-MANIFEST.txt >/dev/null
          ! grep -R -F -- 'target_environment=production' fichario-deploy-ci-a

      - name: Publish deployment validation summary
        if: always()
        run: |
          {
            echo '## Deployment pipeline validation'
            echo
            echo "- Source SHA: \`${GITHUB_SHA}\`"
            echo '- Target contract: `staging` only'
            echo '- Reproducibility: two independent package operations compared byte-for-byte at manifest/checksum identity level'
            echo '- Artifacts: throwaway CI packages; never uploaded or deployable as release artifacts'
            echo '- Secrets used: none'
          } >> "$GITHUB_STEP_SUMMARY"

name: Cleanup visual15 staging residue now

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-visual15-residue-now.yml

permissions:
  contents: read

concurrency:
  group: cleanup-visual15-residue-now
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    env:
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      STAGING_AUTHORIZED_EMAIL: ${{ secrets.STAGING_AUTHORIZED_EMAIL }}
      STAGING_AUTHORIZED_PASSWORD: ${{ secrets.STAGING_AUTHORIZED_PASSWORD }}
      VISUAL_BENCHMARK_PHASE: cleanup
      VISUAL_BENCHMARK_STATE_PATH: /tmp/visual15-residue-state.json
      VISUAL_CLEANUP_REPORT_PATH: /tmp/visual15-residue-cleanup.json
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Write known residue state
        shell: bash
        run: |
          cat > "$VISUAL_BENCHMARK_STATE_PATH" <<'JSON'
          {
            "notebookId": "6a238fb6-5fbd-4b39-ad54-b9c1d4d3a7bd",
            "probes": [
              {"id":"kanban","documentId":"c0610143-f0d4-4d6b-8937-44c20f163114"},
              {"id":"route","documentId":"49d08463-303f-4806-ba7e-f15cb713ac9a"}
            ],
            "jpegSmoke": {"id":"jpeg-smoke","documentId":"193c4587-e438-4532-9e49-37e3d360b58f"}
          }
          JSON
      - name: Cleanup through real application endpoint
        run: node tools/checks/check-visual-semantic-staging.mjs
      - name: Upload cleanup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual15-residue-cleanup-${{ github.run_id }}
          path: /tmp/visual15-residue-cleanup.json
          if-no-files-found: warn
          retention-days: 7

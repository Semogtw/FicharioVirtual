name: Deploy Supabase staging

on:
  workflow_run:
    workflows: [Validate current head]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

concurrency:
  group: supabase-staging-deploy
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
      deploy_required: ${{ steps.changes.outputs.required }}
    steps:
      - name: Resolve validated target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            target_sha="$DISPATCH_SHA"
          else
            target_sha="$VALIDATED_SHA"
          fi
          test -n "$target_sha"
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout validated source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect unapplied staging runtime changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha=""
          while read -r deployment_id deployment_sha; do
            state="$(gh api "/repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses?per_page=1" --jq '.[0].state // ""')"
            if [ "$state" = "success" ]; then
              base_sha="$deployment_sha"
              break
            fi
          done < <(
            gh api "/repos/$GITHUB_REPOSITORY/deployments?environment=staging-deploy&per_page=20" \
              --jq '.[] | "\(.id) \(.sha)"'
          )

          if [ -z "$base_sha" ] || ! git merge-base --is-ancestor "$base_sha" "$TARGET_SHA"; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$base_sha" "$TARGET_SHA" -- \
            supabase \
            .github/workflows/deploy-supabase-staging.yml \
            .github/workflows/verify-supabase-staging.yml \
            .github/workflows/verify-ocr-staging.yml \
            tools/checks/check-supabase-staging.mjs \
            tools/checks/check-drive-oauth-staging.mjs \
            tools/checks/check-ocr-staging.mjs \
            tools/checks/check-desktop-ocr-pairing-staging.mjs; then
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: resolve
    if: needs.resolve.outputs.deploy_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging-deploy
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      STAGING_APP_ORIGIN: https://staging.fichario-virtual.pages.dev
      STAGING_APP_ORIGIN_ALLOWLIST: https://staging.fichario-virtual.pages.dev,https://fichario-virtual.pages.dev,https://*.fichario-virtual.pages.dev

    steps:
      - name: Checkout validated repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.target_sha }}
          persist-credentials: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: 2.111.0

      - name: Validate protected deployment configuration
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$STAGING_SUPABASE_PROJECT_REF"

      - name: Link staging project
        run: supabase link --project-ref "$STAGING_SUPABASE_PROJECT_REF"

      - name: Align canonical staging Edge Function configuration
        shell: bash
        run: |
          set -euo pipefail
          # Active is the canonical operating mode. The visual benchmark may
          # switch to shadow only temporarily and must always restore active.
          supabase secrets set --project-ref "$STAGING_SUPABASE_PROJECT_REF" \
            "APP_ORIGIN=$STAGING_APP_ORIGIN" \
            "APP_ORIGIN_ALLOWLIST=$STAGING_APP_ORIGIN_ALLOWLIST" \
            "OCR_MODEL_PRIMARY=gemini-3.1-flash-lite" \
            "OCR_MODEL_FALLBACK=gemini-3.5-flash-lite" \
            "OCR_MODEL_PRIMARY_RPM=12" \
            "OCR_MODEL_FALLBACK_RPM=12" \
            "OCR_PROVIDER_MAX_QUEUE_WAIT_MS=20000" \
            "SEMANTIC_VISUAL_MODE=active" \
            "GOOGLE_DRIVE_REDIRECT_URI=https://$STAGING_SUPABASE_PROJECT_REF.supabase.co/functions/v1/drive-oauth-callback" \
            "GOOGLE_DRIVE_SCOPE=https://www.googleapis.com/auth/drive.file" \
            "GOOGLE_DRIVE_ROOT_FOLDER_NAME=Fichário Digital"

      - name: Show migration drift before deployment
        run: supabase migration list --linked

      - name: Preview all pending migrations, including out-of-order files
        # A later remote migration can already exist when an older local file is
        # promoted. Include every local pending file explicitly and keep dry-run
        # failure-visible so drift is never silently skipped.
        run: supabase db push --linked --dry-run --include-all

      - name: Apply all pending migrations, including out-of-order files
        run: supabase db push --linked --include-all

      - name: Confirm linked migration history
        run: supabase migration list --linked

      - name: Deploy versioned Edge Functions
        run: supabase functions deploy --project-ref "$STAGING_SUPABASE_PROJECT_REF"

      - name: Confirm deployed Edge Functions
        run: supabase functions list --project-ref "$STAGING_SUPABASE_PROJECT_REF"

  verify-supabase:
    needs: [resolve, deploy]
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    concurrency:
      group: staging-contract-verification
      cancel-in-progress: false

    steps:
      - name: Checkout validated repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.target_sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Auth, RLS, and private Storage
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_AUTHORIZED_EMAIL: ${{ secrets.STAGING_AUTHORIZED_EMAIL }}
          STAGING_AUTHORIZED_PASSWORD: ${{ secrets.STAGING_AUTHORIZED_PASSWORD }}
          STAGING_UNAUTHORIZED_EMAIL: ${{ secrets.STAGING_UNAUTHORIZED_EMAIL }}
          STAGING_UNAUTHORIZED_PASSWORD: ${{ secrets.STAGING_UNAUTHORIZED_PASSWORD }}
        run: pnpm test:staging:supabase

      - name: Verify Google Drive OAuth bootstrap
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_AUTHORIZED_EMAIL: ${{ secrets.STAGING_AUTHORIZED_EMAIL }}
          STAGING_AUTHORIZED_PASSWORD: ${{ secrets.STAGING_AUTHORIZED_PASSWORD }}
          STAGING_APP_ORIGIN: https://staging.fichario-virtual.pages.dev
          STAGING_APP_ORIGIN_ALLOWLIST: https://staging.fichario-virtual.pages.dev,https://fichario-virtual.pages.dev,https://*.fichario-virtual.pages.dev
        run: node tools/checks/check-drive-oauth-staging.mjs

      - name: Verify desktop OCR one-time pairing
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_AUTHORIZED_EMAIL: ${{ secrets.STAGING_AUTHORIZED_EMAIL }}
          STAGING_AUTHORIZED_PASSWORD: ${{ secrets.STAGING_AUTHORIZED_PASSWORD }}
        run: pnpm test:staging:desktop-ocr-pairing

  verify-ocr:
    needs: [resolve, deploy, verify-supabase]
    if: needs.deploy.result == 'success' && needs.verify-supabase.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    concurrency:
      group: staging-contract-verification
      cancel-in-progress: false
    env:
      OCR_STAGING_REPORT_PATH: /tmp/ocr-staging-report.json

    steps:
      - name: Checkout validated repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.target_sha }}
          persist-credentials: false

      - name: Initialize sanitized OCR report
        run: |
          cat > "$OCR_STAGING_REPORT_PATH" <<'JSON'
          {"schemaVersion":2,"status":"not_run","failureStage":"configuration","stages":{"authenticated":false,"authorized":false,"consentRecorded":false,"importCreated":false,"functionCompleted":false,"persistenceVerified":false},"outcome":{"documentStatus":null,"pageStatus":null,"jobStatus":null,"needsReview":null,"warningCount":null,"attemptCount":null,"tokens":{"fichario":null,"ocr":null,"numericProbe":null}},"diagnostic":{"httpStatus":null,"errorKind":null,"providerStatus":null,"providerErrorKind":null,"providerErrorCode":null},"cleanup":{"document":"not_required","session":"not_required"}}
          JSON
          chmod 600 "$OCR_STAGING_REPORT_PATH"

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify real OCR with a synthetic image
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_AUTHORIZED_EMAIL: ${{ secrets.STAGING_AUTHORIZED_EMAIL }}
          STAGING_AUTHORIZED_PASSWORD: ${{ secrets.STAGING_AUTHORIZED_PASSWORD }}
        run: pnpm test:staging:ocr

      - name: Upload sanitized OCR report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ocr-staging-report-${{ github.run_id }}
          path: /tmp/ocr-staging-report.json
          if-no-files-found: error
          retention-days: 7

name: Deploy Supabase staging

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-supabase-staging.yml
      - supabase/config.toml
      - supabase/migrations/**
      - supabase/functions/_shared/gemini-diagnostic-contract.ts
      - supabase/functions/_shared/gemini-ocr-client.ts
      - supabase/functions/_shared/ocr-batch-contract.ts
      - supabase/functions/_shared/ocr-contract.ts
      - supabase/functions/_shared/ocr-failure.ts
      - supabase/functions/process-ocr/index.ts
      - supabase/functions/ocr-boundary-probe/**

permissions:
  contents: read

concurrency:
  group: supabase-staging-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging-deploy
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: 2.111.0

      - name: Validate protected deployment configuration
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$STAGING_SUPABASE_PROJECT_REF"

      - name: Link staging project
        run: supabase link --project-ref "$STAGING_SUPABASE_PROJECT_REF"

      - name: Show migration drift before deployment
        run: supabase migration list --linked

      - name: Preview all pending migrations, including out-of-order files
        # A later remote migration can already exist when an older local file is
        # promoted. Include every local pending file explicitly and keep dry-run
        # failure-visible so drift is never silently skipped.
        run: supabase db push --linked --dry-run --include-all

      - name: Apply all pending migrations, including out-of-order files
        run: supabase db push --linked --include-all

      - name: Confirm linked migration history
        run: supabase migration list --linked

      - name: Deploy versioned Edge Functions
        run: supabase functions deploy --project-ref "$STAGING_SUPABASE_PROJECT_REF"

      - name: Confirm deployed Edge Functions
        run: supabase functions list --project-ref "$STAGING_SUPABASE_PROJECT_REF"

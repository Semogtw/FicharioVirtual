name: Finalize post-merge architecture test alignment once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Materialize current architecture tests
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          import textwrap

          source = Path('.github/workflows/align-postmerge-tests-once.yml').read_text().splitlines()
          index = 0
          written = []
          while index < len(source):
              match = re.match(r"\s*cat > (\S+) <<'EOF'\s*$", source[index])
              if not match:
                  index += 1
                  continue
              path = match.group(1)
              index += 1
              body = []
              while index < len(source) and source[index].strip() != 'EOF':
                  body.append(source[index])
                  index += 1
              if index >= len(source):
                  raise SystemExit(f'unterminated heredoc for {path}')
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(textwrap.dedent('\n'.join(body)) + '\n')
              written.append(path)
              index += 1

          if len(written) != 13:
              raise SystemExit(f'expected 13 aligned tests, generated {len(written)}')

          image = Path('tests/unit/routes/image-cancellation-affordance.test.ts')
          text = image.read_text().replace(
              "expect(source).toContain(\"return ['queued', 'preparing', 'uploading'].includes(entry.item.status);\");",
              "expect(source).toContain(\"? ['queued', 'preparing', 'uploading'].includes(entry.item.status)\");"
          )
          image.write_text(text)

          pdf = Path('tests/unit/routes/pdf-cancellation-affordance.test.ts')
          text = pdf.read_text().replace(
              "expect(source).toContain(\"return ['queued', 'inspecting', 'uploading', 'rendering', 'publishing'].includes(\");",
              "expect(source).toContain(\": ['queued', 'inspecting', 'uploading', 'rendering', 'publishing'].includes(\");"
          )
          pdf.write_text(text)

          config = Path('tests/unit/tooling/supabase-config.test.ts')
          text = config.read_text()
          old = "expect(entries).toEqual(['ocr-queue-worker','drive-oauth-callback','desktop-ocr-pair','desktop-ocr-worker']);"
          if old not in text:
              old = "expect(entries).toEqual([\n    'ocr-queue-worker',\n    'drive-oauth-callback',\n    'desktop-ocr-pair',\n    'desktop-ocr-worker'\n  ]);"
          if old not in text:
              raise SystemExit('non-JWT endpoint expectation not found')
          text = text.replace(
              old,
              "expect([...entries].sort()).toEqual(\n    ['ocr-queue-worker', 'drive-oauth-callback', 'desktop-ocr-pair', 'desktop-ocr-worker'].sort()\n  );"
          )
          config.write_text(text)
          PY
          pnpm exec prettier --write tests/unit/components/native-select-adoption.test.ts tests/unit/hooks/client-ocr-queue.test.ts tests/unit/import/duplicate-consumers.test.ts tests/unit/ocr/desktop-worker-pair-revoke.test.ts tests/unit/routes/image-cancellation-affordance.test.ts tests/unit/routes/pdf-cancellation-affordance.test.ts tests/unit/routes/pdf-file-picker-focus.test.ts tests/unit/routes/import-notebook-selection.test.ts tests/unit/routes/import-progress-announcements.test.ts tests/unit/routes/local-draft-account-isolation.test.ts tests/unit/services/ocr-cancellation.test.ts tests/unit/tooling/ocr-staging-runner.test.ts tests/unit/tooling/supabase-config.test.ts
      - name: Validate aligned architecture tests
        id: tests
        shell: bash
        run: |
          set -uo pipefail
          pnpm exec vitest run tests/unit/components/native-select-adoption.test.ts tests/unit/hooks/client-ocr-queue.test.ts tests/unit/import/duplicate-consumers.test.ts tests/unit/ocr/desktop-worker-pair-revoke.test.ts tests/unit/routes/image-cancellation-affordance.test.ts tests/unit/routes/pdf-cancellation-affordance.test.ts tests/unit/routes/pdf-file-picker-focus.test.ts tests/unit/routes/import-notebook-selection.test.ts tests/unit/routes/import-progress-announcements.test.ts tests/unit/routes/local-draft-account-isolation.test.ts tests/unit/services/ocr-cancellation.test.ts tests/unit/tooling/ocr-staging-runner.test.ts tests/unit/tooling/supabase-config.test.ts 2>&1 | tee final-alignment-vitest.log
          exit ${PIPESTATUS[0]}
      - name: Upload failure evidence
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: final-postmerge-alignment-failure-${{ github.sha }}
          path: final-alignment-vitest.log
          if-no-files-found: error
          retention-days: 2
      - name: Commit validated alignment
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/align-postmerge-tests-once.yml \
            .github/workflows/apply-postmerge-alignment-once.yml \
            .github/workflows/finalize-postmerge-alignment-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: align post-merge architecture contracts'
          git push origin HEAD:main

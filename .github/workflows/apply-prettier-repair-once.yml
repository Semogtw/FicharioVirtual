name: Apply one-shot Prettier repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-prettier-repair-once.yml

permissions:
  contents: write

concurrency:
  group: apply-one-shot-prettier-repair
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply exact repository formatting
        run: |
          pnpm exec prettier --write \
            src/lib/components/DocumentMediaViewer.svelte \
            src/lib/components/UnifiedImportPage.svelte \
            src/lib/import/multipage-drive-upload.ts \
            tests/unit/services/document-detail.test.ts
          git diff --check

      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo 'No formatting changes were needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/lib/components/DocumentMediaViewer.svelte \
            src/lib/components/UnifiedImportPage.svelte \
            src/lib/import/multipage-drive-upload.ts \
            tests/unit/services/document-detail.test.ts
          git commit -m 'style: apply Prettier repair for multipage photo import'
          git push origin HEAD:main

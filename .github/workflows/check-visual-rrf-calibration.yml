name: Check visual RRF calibration

on:
  push:
    branches: [fix/visual-rrf-calibration]
    paths:
      - .github/workflows/check-visual-rrf-calibration.yml
      - supabase/functions/_shared/semantic-config.ts
      - supabase/functions/_shared/semantic-ranking.ts
      - tests/unit/search/visual-semantic-ranking.test.ts

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/visual-rrf-calibration
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: 2.8.1
      - run: pnpm install --frozen-lockfile
      - name: Verify frontend and unit suite
        run: pnpm verify
      - name: Verify Edge Function types
        run: pnpm test:functions:check

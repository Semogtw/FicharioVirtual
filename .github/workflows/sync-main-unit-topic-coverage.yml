name: Sync latest main into unit topic coverage

on:
  push:
    branches:
      - feature/unit-topic-coverage

permissions:
  contents: write

jobs:
  sync-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch with history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Merge current main, preferring main only on conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if [[ "$merge_status" -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if [[ "${#conflicts[@]}" -eq 0 ]]; then
              echo 'Merge failed without resolvable file conflicts.' >&2
              exit "$merge_status"
            fi
            printf 'Resolving conflicts with the current main version:\n'
            printf ' - %s\n' "${conflicts[@]}"
            for path in "${conflicts[@]}"; do
              git checkout --theirs -- "$path"
              git add -- "$path"
            done
          fi

          git add -A
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved merge conflicts remain.' >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify integrated branch
        run: pnpm verify

      - name: Commit verified main merge
        shell: bash
        run: |
          set -euo pipefail
          git commit -m 'Merge main into feature/unit-topic-coverage'
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:feature/unit-topic-coverage

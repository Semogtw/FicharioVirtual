name: Format staging auth isolation

on:
  push:
    branches: [fix/staging-auth-isolation]
    paths:
      - .github/workflows/format-staging-auth-isolation.yml
      - .ci/staging-auth-isolation.patch

permissions:
  contents: write

concurrency:
  group: format-staging-auth-isolation
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/staging-auth-isolation
          fetch-depth: 0
          persist-credentials: true

      - name: Apply verified patch
        run: |
          set -euo pipefail
          git apply --check .ci/staging-auth-isolation.patch
          git apply .ci/staging-auth-isolation.patch

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and validate
        run: |
          set -euo pipefail
          pnpm exec prettier --write tools/checks tests/unit/tooling/staging-auth-isolation.test.ts
          pnpm lint
          pnpm check
          pnpm vitest run tests/unit/tooling/staging-auth-isolation.test.ts
          git diff --check

      - name: Commit fix
        run: |
          set -euo pipefail
          rm .ci/staging-auth-isolation.patch .github/workflows/format-staging-auth-isolation.yml
          rmdir .ci 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(test): isolate shared staging auth sessions'
          git push origin HEAD:fix/staging-auth-isolation

name: Deploy validated staging artifact to Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Run ID of Build deployable Fichário staging artifact
        required: true
        type: string
      expected_source_commit:
        description: Full 40-character source SHA expected in the artifact manifest
        required: true
        type: string
  workflow_run:
    workflows:
      - Build deployable Fichário staging artifact
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-fichario-cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging-deploy
    env:
      TARGET_ENVIRONMENT: staging
      EXPECTED_SOURCE_COMMIT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_source_commit }}
      ARTIFACT_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.artifact_run_id }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_VERSION: '4.120.0'
      WRANGLER_OUTPUT_FILE_PATH: /tmp/wrangler-pages-output.jsonl

    steps:
      - name: Validate immutable deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_ENVIRONMENT" == 'staging' ]] || {
            echo 'this workflow is intentionally staging-only until production infrastructure exists' >&2
            exit 1
          }
          if [[ ! "$EXPECTED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'expected_source_commit must be a full lowercase Git SHA' >&2
            exit 1
          fi
          if [[ ! "$ARTIFACT_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo 'artifact_run_id must be a positive numeric workflow run ID' >&2
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo 'Cloudflare deployment credentials are not provisioned in staging-deploy' >&2
            exit 1
          fi

      - name: Download the validated deployment artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fichario-static-${{ env.EXPECTED_SOURCE_COMMIT }}-staging
          path: deployment-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.ARTIFACT_RUN_ID }}
          digest-mismatch: error

      - name: Verify artifact identity and checksums
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact_root="$GITHUB_WORKSPACE/deployment-artifact"
          if [[ ! -f "$artifact_root/DEPLOYMENT-MANIFEST.txt" && -f "$artifact_root/fichario-deploy/DEPLOYMENT-MANIFEST.txt" ]]; then
            artifact_root="$artifact_root/fichario-deploy"
          fi

          for required in DEPLOYMENT-MANIFEST.txt SHA256SUMS source/package.json source/pnpm-lock.yaml checks/check-deployed-site.mjs checks/check-deployment-artifact.mjs checks/deployment-contract.mjs checks/validate-pages-deploy-output.mjs site/_headers site/200.html site/manifest.webmanifest site/sw.js site/registerSW.js; do
            if [[ ! -f "$artifact_root/$required" ]]; then
              echo "deployment artifact is missing $required" >&2
              exit 1
            fi
          done

          if find "$artifact_root" -type l -print -quit | grep -q .; then
            echo 'deployment artifact must not contain symlinks' >&2
            exit 1
          fi

          manifest_value() {
            local key="$1"
            local value
            value="$(sed -n "s/^${key}=//p" "$artifact_root/DEPLOYMENT-MANIFEST.txt")"
            if [[ -z "$value" || "$value" == *$'\n'* ]]; then
              echo "deployment manifest must contain exactly one non-empty ${key}" >&2
              exit 1
            fi
            printf '%s' "$value"
          }

          [[ "$(manifest_value schema_version)" == '2' ]] || { echo 'unsupported deployment manifest schema' >&2; exit 1; }
          [[ "$(manifest_value source_repository)" == 'Semogtw/FicharioVirtual' ]] || { echo 'unexpected source repository' >&2; exit 1; }
          [[ "$(manifest_value source_commit)" == "$EXPECTED_SOURCE_COMMIT" ]] || { echo 'artifact source SHA does not match requested SHA' >&2; exit 1; }
          [[ "$(manifest_value target_environment)" == 'staging' ]] || { echo 'artifact must target staging' >&2; exit 1; }

          package_sha="$(sha256sum "$artifact_root/source/package.json" | cut -d' ' -f1)"
          lock_sha="$(sha256sum "$artifact_root/source/pnpm-lock.yaml" | cut -d' ' -f1)"
          [[ "$package_sha" == "$(manifest_value package_sha256)" ]] || { echo 'package.json checksum mismatch' >&2; exit 1; }
          [[ "$lock_sha" == "$(manifest_value lock_sha256)" ]] || { echo 'pnpm-lock.yaml checksum mismatch' >&2; exit 1; }

          (
            cd "$artifact_root"
            sha256sum -c SHA256SUMS
          )

          node "$artifact_root/checks/check-deployment-artifact.mjs" "$artifact_root"

          if grep -R -F -n --binary-files=without-match '127.0.0.1:54321' "$artifact_root/site"; then
            echo 'deployment artifact contains the local Supabase URL' >&2
            exit 1
          fi
          if grep -R -F -n --binary-files=without-match 'sb_publishable_test_key_1234567890' "$artifact_root/site"; then
            echo 'deployment artifact contains the test publishable key' >&2
            exit 1
          fi

          echo "root=$artifact_root" >> "$GITHUB_OUTPUT"

      - name: Deploy the exact artifact with pinned Wrangler
        id: deploy
        shell: bash
        env:
          ARTIFACT_ROOT: ${{ steps.artifact.outputs.root }}
        run: |
          set -euo pipefail
          rm -f "$WRANGLER_OUTPUT_FILE_PATH"

          npm exec --yes --package="wrangler@${WRANGLER_VERSION}" -- \
            wrangler pages deploy "$ARTIFACT_ROOT/site" \
              --project-name=fichario-virtual \
              --branch=staging \
              --commit-hash="$EXPECTED_SOURCE_COMMIT" \
              --commit-message="Deploy validated Fichário staging artifact ${EXPECTED_SOURCE_COMMIT}" \
              --commit-dirty=false

          node "$ARTIFACT_ROOT/checks/validate-pages-deploy-output.mjs"

      - name: Verify the exact deployed URL with the artifact-pinned contract
        shell: bash
        env:
          ARTIFACT_ROOT: ${{ steps.artifact.outputs.root }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          node "$ARTIFACT_ROOT/checks/check-deployed-site.mjs" "$DEPLOYMENT_URL"

      - name: Record verified deployment target
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          DEPLOYMENT_ALIAS: ${{ steps.deploy.outputs.alias }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
        run: |
          set -euo pipefail
          {
            echo '### Cloudflare Pages staging deployment'
            echo
            echo '- Environment: `staging`'
            echo "- Source SHA: \`$EXPECTED_SOURCE_COMMIT\`"
            echo "- Deployment ID: \`$DEPLOYMENT_ID\`"
            echo "- Exact verified URL: \`$DEPLOYMENT_URL\`"
            if [[ -n "$DEPLOYMENT_ALIAS" ]]; then
              echo "- Alias reported by Wrangler: \`$DEPLOYMENT_ALIAS\`"
            fi
            echo
            echo 'Artifact checksum verification and the HTTP/CSP deployment contract both passed for the exact staging deployment URL.'
          } >> "$GITHUB_STEP_SUMMARY"

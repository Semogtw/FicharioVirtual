name: Verify Cloudflare staging deploy credentials

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-cloudflare-staging-credentials.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-cloudflare-staging-credentials
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: staging-deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Confirm protected credential presence
        run: |
          set -euo pipefail
          missing=0
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo 'CLOUDFLARE_API_TOKEN is not configured in staging-deploy.' >&2
            missing=1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo 'CLOUDFLARE_ACCOUNT_ID is not configured in staging-deploy.' >&2
            missing=1
          fi
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
          echo 'Protected Cloudflare credential names are configured.'

      - name: Verify token can read the exact Pages project
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_status="$(
            curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header 'Accept: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/fichario-virtual"
          )"
          HTTP_STATUS="$http_status" RESPONSE_FILE="$response_file" node <<'NODE'
          const { readFileSync } = require('node:fs');
          const status = Number(process.env.HTTP_STATUS);
          const payload = JSON.parse(readFileSync(process.env.RESPONSE_FILE, 'utf8'));
          if (status !== 200 || payload?.success !== true) {
            throw new Error(`Cloudflare project lookup failed with HTTP ${status}`);
          }
          if (payload?.result?.name !== 'fichario-virtual') {
            throw new Error('Cloudflare token resolved an unexpected Pages project');
          }
          if (payload?.result?.production_branch !== 'main') {
            throw new Error('Cloudflare Pages production branch is not main');
          }
          console.log('Cloudflare Pages project access: PASS');
          NODE

      - name: Verify token can request a temporary Pages upload token
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_status="$(
            curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header 'Accept: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/fichario-virtual/upload-token"
          )"
          HTTP_STATUS="$http_status" RESPONSE_FILE="$response_file" node <<'NODE'
          const { readFileSync } = require('node:fs');
          const status = Number(process.env.HTTP_STATUS);
          const payload = JSON.parse(readFileSync(process.env.RESPONSE_FILE, 'utf8'));
          if (status !== 200 || payload?.success !== true) {
            throw new Error(`Cloudflare upload-token request failed with HTTP ${status}`);
          }
          const jwt = payload?.result?.jwt;
          if (typeof jwt !== 'string' || jwt.split('.').length !== 3 || jwt.length < 100) {
            throw new Error('Cloudflare did not return a valid temporary upload token');
          }
          console.log('Cloudflare temporary upload-token permission: PASS');
          NODE

      - name: Publish credential readiness summary
        if: always()
        run: |
          {
            echo '## Cloudflare staging deployment credential check'
            echo
            echo '- Environment: `staging-deploy`'
            echo '- Project: `fichario-virtual`'
            echo '- No secret or temporary JWT values are printed or persisted by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"

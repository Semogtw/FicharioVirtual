name: Format security gate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/format-security-gate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-security-gate
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and verify security gate
        run: |
          pnpm exec prettier --write tools/checks/check-source-security.mjs
          pnpm exec prettier --check tools/checks/check-source-security.mjs

      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/checks/check-source-security.mjs
          git commit -m 'style: format the PWA source security gate'
          git push origin HEAD:main

name: Simplify remaining user-facing copy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-user-copy-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Simplify remaining copy
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected copy in {path}: {old[:90]!r}')
              file.write_text(text.replace(old, new, 1))

          review = 'src/routes/review/+page.svelte'
          replace(review, "\t\tblocked_quota: 'Aguardando nova cota',", "\t\tblocked_quota: 'Aguardando',")
          replace(review, "\t\tfailed: 'Falha permanente'", "\t\tfailed: 'Falha'")
          replace(review, '<p class="eyebrow">Qualidade e continuidade</p>', '<p class="eyebrow">Revisão</p>')
          replace(review, "\t\t<p>\n\t\t\tCorrija trechos incertos e retome páginas interrompidas sem reenviar os arquivos originais.\n\t\t</p>", "\t\t<p>Revise as páginas que precisam de atenção.</p>")
          replace(review, 'description="Quando o OCR sinalizar dúvida, quota ou falha, a página aparecerá aqui."', 'description="Quando uma página precisar de atenção, ela aparecerá aqui."')

          replace('src/routes/settings/+layout.svelte', '\t\tFila OCR\n', '\t\tFila de leitura\n')

          computers = Path('src/routes/settings/computers/+page.svelte')
          text = computers.read_text()
          text, count = re.subn(r"\n\tfunction capabilitySummary\(device: DesktopOcrDevice\) \{.*?\n\t\}\n\n\tasync function refreshDevices", "\n\tasync function refreshDevices", text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('could not remove capabilitySummary')
          changes = [
              ('<title>Computadores de OCR — Fichário Virtual</title>', '<title>Computadores — Fichário Virtual</title>'),
              ('<p class="eyebrow">OCR local</p>', '<p class="eyebrow">Leitura local</p>'),
              ("\t\t\t\t<p>\n\t\t\t\t\tGerencie dispositivos autorizados a processar páginas localmente. Credenciais do worker\n\t\t\t\t\tnunca são exibidas nesta tela.\n\t\t\t\t</p>", "\t\t\t\t<p>Gerencie os computadores conectados ao Fichário.</p>"),
              ('<h2 id="pairing-title">Pareamento seguro</h2>', '<h2 id="pairing-title">Conectar computador</h2>'),
              ("\t\t\t<p>\n\t\t\t\tGere um código de uso único e informe-o somente ao worker local. O token da sua sessão web\n\t\t\t\tnão sai do navegador; a credencial permanente é gerada no próprio computador e guardada no\n\t\t\t\tSecret Service.\n\t\t\t</p>", "\t\t\t<p>Gere um código e use-o no computador que deseja conectar.</p>"),
              ('<span class="badge">Saída HTTPS apenas</span>', '<span class="badge">Conexão segura</span>'),
              ("\t\t\t\t<p class=\"pairing-help\">\n\t\t\t\t\tTroque “Meu computador” pelo nome desejado. O comando solicitará o código em seguida para\n\t\t\t\t\tevitá-lo no histórico do shell. Depois do sucesso, use “Atualizar” para ver o dispositivo.\n\t\t\t\t</p>", "\t\t\t\t<p class=\"pairing-help\">Troque “Meu computador” pelo nome desejado. Depois, use “Atualizar” para ver o dispositivo.</p>"),
              ('<p>Gere um código acima e conclua o pareamento no worker local.</p>', '<p>Gere um código acima e conclua a conexão no computador.</p>'),
              ('\n\t\t\t\t\t\t\t<p class="capabilities">{capabilitySummary(device)}</p>', '')
          ]
          for old, new in changes:
              if old not in text:
                  raise SystemExit(f'missing expected computers copy: {old[:90]!r}')
              text = text.replace(old, new, 1)
          text = text.replace('\n\t.empty p,\n\t.capabilities {', '\n\t.empty p {', 1)
          text = re.sub(r"\n\t\.capabilities \{\n\t\tmargin-top: 0\.25rem;.*?\n\t\}\n", "\n", text, count=1, flags=re.S)
          computers.write_text(text)

          queue = Path('src/routes/settings/computers/queue/+page.svelte')
          text = queue.read_text()
          changes = [
              ("\t\tif (status === 'processing' && leaseExpired) return 'Lease expirado';", "\t\tif (status === 'processing' && leaseExpired) return 'Precisa de atenção';"),
              ("\t\t\tconst change = await returnDesktopOcrJobToGemini(job.pageId);\n\t\t\tjobs = jobs.filter((item) => item.pageId !== job.pageId);\n\t\t\tnotice = change.recoveredExpiredLease\n\t\t\t\t? 'Lease expirado recuperado. O trabalho voltou para a fila do Gemini.'\n\t\t\t\t: 'O trabalho voltou para a fila do Gemini.';", "\t\t\tawait returnDesktopOcrJobToGemini(job.pageId);\n\t\t\tjobs = jobs.filter((item) => item.pageId !== job.pageId);\n\t\t\tnotice = 'A página voltou para a leitura automática.';"),
              ("'Não foi possível devolver o trabalho ao Gemini.'", "'Não foi possível devolver a página para a leitura automática.'"),
              ('<title>Fila de OCR local — Fichário Virtual</title>', '<title>Fila de leitura local — Fichário Virtual</title>'),
              ('<p class="eyebrow">OCR local</p>', '<p class="eyebrow">Leitura local</p>'),
              ('<h1 id="page-title">Fila desktop</h1>', '<h1 id="page-title">Fila de leitura</h1>'),
              ("\t\t\t<p>\n\t\t\t\tAcompanhe trabalhos roteados para seus computadores. Esta tela mostra somente metadados\n\t\t\t\toperacionais; texto OCR, URLs temporárias, credenciais e identificadores de lease não são\n\t\t\t\texpostos.\n\t\t\t</p>", "\t\t\t<p>Acompanhe as páginas enviadas aos seus computadores.</p>"),
              ('<nav class="subnav" aria-label="OCR local">', '<nav class="subnav" aria-label="Leitura local">'),
              ('<a href="/settings/computers/queue/" aria-current="page">Fila desktop</a>', '<a href="/settings/computers/queue/" aria-current="page">Fila de leitura</a>'),
              ('<span>leases expirados</span>', '<span>precisam de atenção</span>'),
              ('<p class="eyebrow">Últimos trabalhos</p>', '<p class="eyebrow">Itens recentes</p>'),
              ('<span class="limit">Até 100 trabalhos desktop recentes</span>', '<span class="limit">Até 100 itens recentes</span>'),
              ('<div class="empty" role="status">Carregando fila desktop…</div>', '<div class="empty" role="status">Carregando…</div>'),
              ('<strong>Nenhum trabalho roteado para OCR local.</strong>', '<strong>Nenhuma página aguardando leitura local.</strong>'),
              ('<p>Quando uma página usar a rota desktop, ela aparecerá aqui.</p>', '<p>Quando uma página for enviada a um computador, ela aparecerá aqui.</p>'),
              ("\t\t\t\t\t\t\t\t<p class=\"lease-warning\">\n\t\t\t\t\t\t\t\t\tO computador perdeu o lease. Você pode devolver este trabalho ao Gemini agora ou\n\t\t\t\t\t\t\t\t\taguardar outro dispositivo ativo recuperá-lo automaticamente.\n\t\t\t\t\t\t\t\t</p>", "\t\t\t\t\t\t\t\t<p class=\"lease-warning\">Este computador parou de responder. Você pode devolver a página para a leitura automática ou aguardar outro computador.</p>"),
              ('<dt>Lease até</dt>', '<dt>Prazo atual</dt>'),
              ('<dt>Último código</dt>', '<dt>Último erro</dt>'),
              ("label={movingPageId === job.pageId ? 'Movendo…' : 'Usar Gemini'}", "label={movingPageId === job.pageId ? 'Movendo…' : 'Usar leitura automática'}")
          ]
          for old, new in changes:
              if old not in text:
                  raise SystemExit(f'missing expected queue copy: {old[:90]!r}')
              text = text.replace(old, new, 1)
          queue.write_text(text)

          usage = Path('src/routes/settings/usage/+page.svelte')
          text = usage.read_text()
          changes = [
              ("\t\t<p>\n\t\t\tContadores informativos do seu próprio arquivo. Eles não criam franquia nem bloqueiam uma\n\t\t\tchamada que o provedor ainda aceitaria.\n\t\t</p>", "\t\t<p>Veja um resumo dos documentos, páginas e leituras recentes.</p>"),
              ('<span>Cota do provedor</span>', '<span>Aguardando</span>'),
              ('<h2 id="history-title">Páginas enviadas ao OCR</h2>', '<h2 id="history-title">Páginas lidas</h2>'),
              ('\n\t\t\t\t<span>Laranja indica cota real do provedor, não limite interno.</span>', ''),
              ('<p class="empty-history">Nenhum uso OCR registrado neste período.</p>', '<p class="empty-history">Nenhuma leitura registrada neste período.</p>')
          ]
          for old, new in changes:
              if old not in text:
                  raise SystemExit(f'missing expected usage copy: {old[:90]!r}')
              text = text.replace(old, new, 1)
          text = text.replace('\n\t.section-heading > span,\n\t.generated {', '\n\t.generated {', 1)
          usage.write_text(text)

          tests = Path('tests/unit/routes/desktop-ocr-queue-page.test.ts')
          text = tests.read_text()
          text = text.replace("expect(page).toContain('aguardar outro dispositivo ativo recuperá-lo automaticamente');", "expect(page).toContain('aguardar outro computador');")
          text = text.replace("expect(page).toContain(\"'Usar Gemini'\");", "expect(page).toContain(\"'Usar leitura automática'\");")
          text = text.replace("\n\t\texpect(page).toContain('recoveredExpiredLease');", '')
          text = text.replace("expect(settingsLayout).toContain('Fila OCR');", "expect(settingsLayout).toContain('Fila de leitura');")
          tests.write_text(text)
          PY
      - name: Format changed files
        run: pnpm exec prettier --write src/routes/review/+page.svelte src/routes/settings/+layout.svelte src/routes/settings/computers/+page.svelte src/routes/settings/computers/queue/+page.svelte src/routes/settings/usage/+page.svelte tests/unit/routes/desktop-ocr-queue-page.test.ts
      - name: Remove temporary workflow before repository tests
        run: rm .github/workflows/apply-user-copy-cleanup.yml
      - name: Verify
        run: pnpm verify
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: simplify remaining user-facing technical copy"
          git pull --rebase origin main
          git push origin HEAD:main

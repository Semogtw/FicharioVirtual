name: Run visual staging now

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-visual-staging-now.yml

permissions:
  contents: read

concurrency:
  group: visual-staging-now
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: staging
    env:
      VISUAL_BENCHMARK_PHASE: setup-shadow
      VISUAL_BENCHMARK_STATE_PATH: /tmp/visual-state.json
      VISUAL_SHADOW_REPORT_PATH: /tmp/visual-shadow.json
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      STAGING_AUTHORIZED_EMAIL: ${{ secrets.STAGING_AUTHORIZED_EMAIL }}
      STAGING_AUTHORIZED_PASSWORD: ${{ secrets.STAGING_AUTHORIZED_PASSWORD }}
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run real shadow corpus and PNG/JPEG smoke
        run: node tools/checks/check-visual-semantic-staging.mjs
      - name: Upload shadow state and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-now-shadow-${{ github.run_id }}
          path: |
            /tmp/visual-state.json
            /tmp/visual-shadow.json
          if-no-files-found: warn
          retention-days: 7

  activate:
    needs: shadow
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging-deploy
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
    steps:
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: 2.111.0
      - name: Temporarily enable active visual ranking
        run: |
          supabase secrets set --project-ref "$STAGING_SUPABASE_PROJECT_REF" "SEMANTIC_VISUAL_MODE=active"
          sleep 20

  active:
    needs: [shadow, activate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    env:
      VISUAL_BENCHMARK_PHASE: measure-active
      VISUAL_BENCHMARK_STATE_PATH: /tmp/visual-input/visual-state.json
      VISUAL_ACTIVE_REPORT_PATH: /tmp/visual-active.json
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      STAGING_AUTHORIZED_EMAIL: ${{ secrets.STAGING_AUTHORIZED_EMAIL }}
      STAGING_AUTHORIZED_PASSWORD: ${{ secrets.STAGING_AUTHORIZED_PASSWORD }}
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download shadow state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: visual-now-shadow-${{ github.run_id }}
          path: /tmp/visual-input
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Measure real active multimodal ranking
        run: node tools/checks/check-visual-semantic-staging.mjs
      - name: Upload active report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-now-active-${{ github.run_id }}
          path: /tmp/visual-active.json
          if-no-files-found: warn
          retention-days: 7

  restore-shadow:
    needs: [shadow, activate, active]
    if: always() && needs.shadow.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging-deploy
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
    steps:
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: 2.111.0
      - name: Restore safe shadow mode
        run: supabase secrets set --project-ref "$STAGING_SUPABASE_PROJECT_REF" "SEMANTIC_VISUAL_MODE=shadow"

  compare-cleanup:
    needs: [shadow, active, restore-shadow]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    env:
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      STAGING_AUTHORIZED_EMAIL: ${{ secrets.STAGING_AUTHORIZED_EMAIL }}
      STAGING_AUTHORIZED_PASSWORD: ${{ secrets.STAGING_AUTHORIZED_PASSWORD }}
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download shadow state and report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: visual-now-shadow-${{ github.run_id }}
          path: /tmp/visual-shadow-input
      - name: Download active report
        if: needs.active.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: visual-now-active-${{ github.run_id }}
          path: /tmp/visual-active-input
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Compare shadow against active
        if: needs.active.result == 'success' && needs.restore-shadow.result == 'success'
        env:
          VISUAL_BENCHMARK_PHASE: compare
          VISUAL_SHADOW_REPORT_PATH: /tmp/visual-shadow-input/visual-shadow.json
          VISUAL_ACTIVE_REPORT_PATH: /tmp/visual-active-input/visual-active.json
          VISUAL_COMPARISON_REPORT_PATH: /tmp/visual-comparison.json
        run: node tools/checks/check-visual-semantic-staging.mjs
      - name: Cleanup benchmark documents
        if: always()
        env:
          VISUAL_BENCHMARK_PHASE: cleanup
          VISUAL_BENCHMARK_STATE_PATH: /tmp/visual-shadow-input/visual-state.json
          VISUAL_CLEANUP_REPORT_PATH: /tmp/visual-cleanup.json
        run: |
          if [[ -f "$VISUAL_BENCHMARK_STATE_PATH" ]]; then
            node tools/checks/check-visual-semantic-staging.mjs
          else
            echo 'No benchmark state exists; nothing to clean.'
          fi
      - name: Upload final reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-now-final-${{ github.run_id }}
          path: |
            /tmp/visual-comparison.json
            /tmp/visual-cleanup.json
          if-no-files-found: warn
          retention-days: 7

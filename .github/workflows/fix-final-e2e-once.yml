name: Final E2E background import check

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add drop-zone semantics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/lib/components/UnifiedImportPage.svelte')
          text = path.read_text()
          old = '\t<section\n\t\tclass:dragging\n\t\tclass="drop-zone"'
          new = '\t<section\n\t\trole="group"\n\t\taria-label="Área de importação de arquivos"\n\t\tclass:dragging\n\t\tclass="drop-zone"'
          if old not in text:
              raise SystemExit('drop-zone insertion point missing')
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write src/lib/components/UnifiedImportPage.svelte tests/e2e/import-multitab.spec.ts tests/e2e/pdf-import.spec.ts
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run corrected E2E
        run: pnpm exec playwright test tests/e2e/import-multitab.spec.ts tests/e2e/pdf-import.spec.ts --project=chromium-tablet
      - name: Commit validated changes
        shell: bash
        run: |
          rm .github/workflows/fix-final-e2e-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: finalize background import E2E coverage'
          git push origin HEAD:main

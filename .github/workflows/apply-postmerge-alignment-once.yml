name: Apply validated post-merge test alignment once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Materialize and validate aligned tests
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          import textwrap

          source = Path('.github/workflows/align-postmerge-tests-once.yml').read_text().splitlines()
          index = 0
          written = []
          while index < len(source):
              match = re.match(r"\s*cat > (\S+) <<'EOF'\s*$", source[index])
              if not match:
                  index += 1
                  continue
              path = match.group(1)
              index += 1
              body = []
              while index < len(source) and source[index].strip() != 'EOF':
                  body.append(source[index])
                  index += 1
              if index >= len(source):
                  raise SystemExit(f'unterminated heredoc for {path}')
              content = textwrap.dedent('\n'.join(body)) + '\n'
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content)
              written.append(path)
              index += 1

          expected = {
              'tests/unit/components/native-select-adoption.test.ts',
              'tests/unit/hooks/client-ocr-queue.test.ts',
              'tests/unit/import/duplicate-consumers.test.ts',
              'tests/unit/ocr/desktop-worker-pair-revoke.test.ts',
              'tests/unit/routes/image-cancellation-affordance.test.ts',
              'tests/unit/routes/pdf-cancellation-affordance.test.ts',
              'tests/unit/routes/pdf-file-picker-focus.test.ts',
              'tests/unit/routes/import-notebook-selection.test.ts',
              'tests/unit/routes/import-progress-announcements.test.ts',
              'tests/unit/routes/local-draft-account-isolation.test.ts',
              'tests/unit/services/ocr-cancellation.test.ts',
              'tests/unit/tooling/ocr-staging-runner.test.ts',
              'tests/unit/tooling/supabase-config.test.ts'
          }
          if set(written) != expected:
              raise SystemExit(f'unexpected generated test set: {written}')

          path = Path('tests/unit/services/ocr-cancellation.test.ts')
          text = path.read_text()
          text, count = re.subn(
              r"toHaveBeenCalledWith\(\s*'process-ocr'\s*,\s*\{",
              "toHaveBeenCalledWith('process-ocr-batch', {",
              text,
              count=1
          )
          if count != 1:
              raise SystemExit('OCR cancellation invocation expectation was not updated exactly once')
          path.write_text(text)

          path = Path('tests/unit/tooling/ocr-staging-runner.test.ts')
          text = path.read_text()
          text, count = re.subn(
              r'isRetryLater\(invocation\.data,\s*pageId\)',
              'isRetryLater(invocation?.data, pageId)',
              text,
              count=1
          )
          if count != 1:
              raise SystemExit('OCR staging optional-chaining expectation was not updated exactly once')
          path.write_text(text)

          path = Path('tests/unit/tooling/supabase-config.test.ts')
          text = path.read_text()
          pattern = re.compile(
              r"expect\(entries\)\.toEqual\(\[\s*'ocr-queue-worker',\s*'drive-oauth-callback',\s*'desktop-ocr-pair',\s*'desktop-ocr-worker'\s*\]\);",
              re.MULTILINE
          )
          replacement = "expect([...entries].sort()).toEqual(\n\t\t['ocr-queue-worker', 'drive-oauth-callback', 'desktop-ocr-pair', 'desktop-ocr-worker'].sort()\n\t);"
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Supabase non-JWT endpoint expectation was not updated exactly once')
          path.write_text(text)
          PY
          pnpm exec prettier --write tests/unit/components/native-select-adoption.test.ts tests/unit/hooks/client-ocr-queue.test.ts tests/unit/import/duplicate-consumers.test.ts tests/unit/ocr/desktop-worker-pair-revoke.test.ts tests/unit/routes/image-cancellation-affordance.test.ts tests/unit/routes/pdf-cancellation-affordance.test.ts tests/unit/routes/pdf-file-picker-focus.test.ts tests/unit/routes/import-notebook-selection.test.ts tests/unit/routes/import-progress-announcements.test.ts tests/unit/routes/local-draft-account-isolation.test.ts tests/unit/services/ocr-cancellation.test.ts tests/unit/tooling/ocr-staging-runner.test.ts tests/unit/tooling/supabase-config.test.ts
          pnpm exec vitest run tests/unit/components/native-select-adoption.test.ts tests/unit/hooks/client-ocr-queue.test.ts tests/unit/import/duplicate-consumers.test.ts tests/unit/ocr/desktop-worker-pair-revoke.test.ts tests/unit/routes/image-cancellation-affordance.test.ts tests/unit/routes/pdf-cancellation-affordance.test.ts tests/unit/routes/pdf-file-picker-focus.test.ts tests/unit/routes/import-notebook-selection.test.ts tests/unit/routes/import-progress-announcements.test.ts tests/unit/routes/local-draft-account-isolation.test.ts tests/unit/services/ocr-cancellation.test.ts tests/unit/tooling/ocr-staging-runner.test.ts tests/unit/tooling/supabase-config.test.ts
          rm .github/workflows/align-postmerge-tests-once.yml .github/workflows/apply-postmerge-alignment-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: align post-merge architecture contracts'
          git push origin HEAD:main

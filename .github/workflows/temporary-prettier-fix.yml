name: Temporary Prettier repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-prettier-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format pending files and push
        run: |
          pnpm exec prettier --write \
            src/lib/components/ConfirmDialog.svelte \
            src/lib/components/ImportQueueTray.svelte \
            src/lib/drive/browser-download.ts \
            src/routes/notebooks/+page.svelte \
            'src/routes/notebooks/[id]/+page.svelte' \
            tests/unit/tooling/no-browser-dialogs.test.ts \
            tools/checks/check-real-app-actions.mjs
          if git diff --quiet; then
            echo 'No formatting changes remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/lib/components/ConfirmDialog.svelte \
            src/lib/components/ImportQueueTray.svelte \
            src/lib/drive/browser-download.ts \
            src/routes/notebooks/+page.svelte \
            'src/routes/notebooks/[id]/+page.svelte' \
            tests/unit/tooling/no-browser-dialogs.test.ts \
            tools/checks/check-real-app-actions.mjs
          git commit -m 'style: apply remaining Prettier repairs'
          git push origin HEAD:main

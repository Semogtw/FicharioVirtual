name: Format deployment check

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/format-deployment-check.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Format deployment checker
        run: |
          pnpm exec prettier --write \
            tests/unit/tooling/deployment-contract.test.ts \
            tools/checks/check-deployed-site.mjs \
            tools/checks/deployment-contract.mjs
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No formatting changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tests/unit/tooling/deployment-contract.test.ts \
            tools/checks/check-deployed-site.mjs \
            tools/checks/deployment-contract.mjs
          git commit -m 'style: format deployment verification files'
          git push origin HEAD:main

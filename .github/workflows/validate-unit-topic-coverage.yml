name: Validate unit topic coverage

on:
  push:
    branches:
      - feature/unit-topic-coverage
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply feature-only formatting and lint repair
        run: |
          pnpm exec prettier --write \
            docs/UNIT_TOPIC_COVERAGE.md \
            src/lib/components/AppShell.svelte \
            src/lib/components/MobileNavigation.svelte \
            src/lib/components/NavigationIcon.svelte \
            src/lib/coverage/topic-coverage.ts \
            src/lib/coverage/topic-import.ts \
            src/lib/services/topic-coverage.ts \
            src/lib/services/coverage-photo-import.ts \
            src/routes/coverage/+page.svelte \
            tests/unit/coverage/topic-coverage.test.ts \
            tests/unit/coverage/topic-import.test.ts \
            tests/unit/coverage/photo-topic-import.test.ts
          pnpm exec eslint --fix \
            src/lib/components/AppShell.svelte \
            src/lib/components/MobileNavigation.svelte \
            src/lib/components/NavigationIcon.svelte \
            src/lib/coverage/topic-coverage.ts \
            src/lib/coverage/topic-import.ts \
            src/lib/services/topic-coverage.ts \
            src/lib/services/coverage-photo-import.ts \
            src/routes/coverage/+page.svelte \
            tests/unit/coverage/topic-coverage.test.ts \
            tests/unit/coverage/topic-import.test.ts \
            tests/unit/coverage/photo-topic-import.test.ts
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add \
              docs/UNIT_TOPIC_COVERAGE.md \
              src/lib/components/AppShell.svelte \
              src/lib/components/MobileNavigation.svelte \
              src/lib/components/NavigationIcon.svelte \
              src/lib/services/topic-coverage.ts \
              src/lib/services/coverage-photo-import.ts
            git add -f \
              src/lib/coverage/topic-coverage.ts \
              src/lib/coverage/topic-import.ts \
              src/routes/coverage/+page.svelte \
              tests/unit/coverage/topic-coverage.test.ts \
              tests/unit/coverage/topic-import.test.ts \
              tests/unit/coverage/photo-topic-import.test.ts
            git commit -m 'style(coverage): format OCR syllabus workflow'
            git push origin HEAD:feature/unit-topic-coverage
          fi

      - name: Lint feature source
        run: |
          pnpm exec prettier --check \
            docs/UNIT_TOPIC_COVERAGE.md \
            src/lib/components/AppShell.svelte \
            src/lib/components/MobileNavigation.svelte \
            src/lib/components/NavigationIcon.svelte \
            src/lib/coverage/topic-coverage.ts \
            src/lib/coverage/topic-import.ts \
            src/lib/services/topic-coverage.ts \
            src/lib/services/coverage-photo-import.ts \
            src/routes/coverage/+page.svelte \
            tests/unit/coverage/topic-coverage.test.ts \
            tests/unit/coverage/topic-import.test.ts \
            tests/unit/coverage/photo-topic-import.test.ts
          pnpm exec eslint \
            src/lib/components/AppShell.svelte \
            src/lib/components/MobileNavigation.svelte \
            src/lib/components/NavigationIcon.svelte \
            src/lib/coverage/topic-coverage.ts \
            src/lib/coverage/topic-import.ts \
            src/lib/services/topic-coverage.ts \
            src/lib/services/coverage-photo-import.ts \
            src/routes/coverage/+page.svelte \
            tests/unit/coverage/topic-coverage.test.ts \
            tests/unit/coverage/topic-import.test.ts \
            tests/unit/coverage/photo-topic-import.test.ts

      - name: Typecheck baseline diagnostic
        continue-on-error: true
        run: pnpm check

      - name: Feature unit tests
        run: >-
          pnpm exec vitest run
          tests/unit/coverage/topic-coverage.test.ts
          tests/unit/coverage/topic-import.test.ts
          tests/unit/coverage/photo-topic-import.test.ts

      - name: Full unit test suite
        continue-on-error: true
        run: pnpm test

      - name: Build
        run: pnpm build
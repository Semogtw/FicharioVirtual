name: Validate unit topic coverage

on:
  push:
    branches:
      - feature/unit-topic-coverage
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply feature-only formatting and lint repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/routes/coverage/+page.svelte')
          text = path.read_text()
          marker = "\tconst coverageRequests = new RequestVersion();\n"
          addition = (
              marker
              + "\tconst topicPlaceholder =\n"
              + "\t\t'3.1 Temperatura\\n3.2 Calor específico\\n3.3 Mudanças de fase\\n3.4 Primeira lei da termodinâmica';\n"
          )
          if 'const topicPlaceholder =' not in text:
              text = text.replace(marker, addition, 1)
          text = text.replace(
              "placeholder={'3.1 Temperatura\\n3.2 Calor específico\\n3.3 Mudanças de fase\\n3.4 Primeira lei da termodinâmica'}",
              'placeholder={topicPlaceholder}',
          )
          path.write_text(text)
          PY
          pnpm exec prettier --write \
            docs/UNIT_TOPIC_COVERAGE.md \
            src/lib/components/AppShell.svelte \
            src/lib/components/MobileNavigation.svelte \
            src/lib/components/NavigationIcon.svelte \
            src/lib/coverage/topic-coverage.ts \
            src/lib/services/topic-coverage.ts \
            src/routes/coverage/+page.svelte \
            tests/unit/coverage/topic-coverage.test.ts
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add \
              src/lib/components/MobileNavigation.svelte \
              src/lib/components/NavigationIcon.svelte \
              src/routes/coverage/+page.svelte
            git commit -m 'style(coverage): format and lint coverage UI'
            git push origin HEAD:feature/unit-topic-coverage
          fi

      - name: Lint feature source
        run: |
          pnpm exec prettier --check \
            docs/UNIT_TOPIC_COVERAGE.md \
            src/lib/components/AppShell.svelte \
            src/lib/components/MobileNavigation.svelte \
            src/lib/components/NavigationIcon.svelte \
            src/lib/coverage/topic-coverage.ts \
            src/lib/services/topic-coverage.ts \
            src/routes/coverage/+page.svelte \
            tests/unit/coverage/topic-coverage.test.ts
          pnpm exec eslint \
            src/lib/components/AppShell.svelte \
            src/lib/components/MobileNavigation.svelte \
            src/lib/components/NavigationIcon.svelte \
            src/lib/coverage/topic-coverage.ts \
            src/lib/services/topic-coverage.ts \
            src/routes/coverage/+page.svelte \
            tests/unit/coverage/topic-coverage.test.ts

      - name: Typecheck
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

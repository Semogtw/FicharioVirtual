name: Validate unit topic coverage

on:
  push:
    branches:
      - feature/unit-topic-coverage
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format feature files in runner and show required patch
        run: |
          pnpm exec prettier --write \
            docs/UNIT_TOPIC_COVERAGE.md \
            src/lib/components/AppShell.svelte \
            src/lib/components/MobileNavigation.svelte \
            src/lib/components/NavigationIcon.svelte \
            src/lib/coverage/topic-coverage.ts \
            src/lib/services/topic-coverage.ts \
            src/routes/coverage/+page.svelte \
            tests/unit/coverage/topic-coverage.test.ts
          git diff -- \
            docs/UNIT_TOPIC_COVERAGE.md \
            src/lib/components/AppShell.svelte \
            src/lib/components/MobileNavigation.svelte \
            src/lib/components/NavigationIcon.svelte \
            src/lib/coverage/topic-coverage.ts \
            src/lib/services/topic-coverage.ts \
            src/routes/coverage/+page.svelte \
            tests/unit/coverage/topic-coverage.test.ts

      - name: Lint feature source
        run: |
          pnpm exec prettier --check \
            docs/UNIT_TOPIC_COVERAGE.md \
            src/lib/components/AppShell.svelte \
            src/lib/components/MobileNavigation.svelte \
            src/lib/components/NavigationIcon.svelte \
            src/lib/coverage/topic-coverage.ts \
            src/lib/services/topic-coverage.ts \
            src/routes/coverage/+page.svelte \
            tests/unit/coverage/topic-coverage.test.ts
          pnpm exec eslint \
            src/lib/components/AppShell.svelte \
            src/lib/components/MobileNavigation.svelte \
            src/lib/components/NavigationIcon.svelte \
            src/lib/coverage/topic-coverage.ts \
            src/lib/services/topic-coverage.ts \
            src/routes/coverage/+page.svelte \
            tests/unit/coverage/topic-coverage.test.ts

      - name: Typecheck
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

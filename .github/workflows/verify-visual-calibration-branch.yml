name: Verify visual calibration branch

on:
  push:
    branches: [fix/visual-threshold-calibration]
    paths:
      - .github/workflows/verify-visual-calibration-branch.yml
      - supabase/functions/_shared/semantic-config.ts
      - tests/unit/search/visual-threshold-calibration.test.ts

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/visual-threshold-calibration
          persist-credentials: true
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Format calibration and remove temporary workflow from verification tree
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write tests/unit/search/visual-threshold-calibration.test.ts
          rm .github/workflows/verify-visual-calibration-branch.yml
          git diff --check
      - name: Verify frontend and unit suite
        run: pnpm verify
      - name: Verify Edge Function types
        run: pnpm test:functions:check
      - name: Commit clean calibrated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test(search): finalize visual threshold calibration'
          git push origin HEAD:fix/visual-threshold-calibration

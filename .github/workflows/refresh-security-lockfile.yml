name: Refresh security lockfile

on:
  push:
    branches:
      - codex-security/deep-audit-2026-08-09
    paths:
      - .github/workflows/refresh-security-lockfile.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message == 'ci: invoke pinned toolchain lockfile refresh'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Refresh lockfile through pinned Offline-Toolchains action
        uses: Semogtw/Offline-Toolchains/.github/actions/refresh-fichario-lockfile@0377d8947bdcfdda975e3763ddece498db1f566d

name: Format Drive progress test once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write tests/unit/pdf/drive-reference-progress.test.ts
          rm .github/workflows/format-drive-progress-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: format Drive reference progress test'
          git push origin HEAD:main

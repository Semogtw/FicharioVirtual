name: Update private data UX docs once

on:
  push:
    branches:
      - feat/private-data-ux
    paths:
      - .github/workflows/private-data-docs-once.yml

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Align privacy documentation through GitHub API
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'feat/private-data-ux';

            function replaceOnce(text, from, to, label) {
              const index = text.indexOf(from);
              if (index < 0) throw new Error(`Missing patch target: ${label}`);
              if (text.indexOf(from, index + from.length) >= 0) throw new Error(`Ambiguous patch target: ${label}`);
              return text.slice(0, index) + to + text.slice(index + from.length);
            }

            async function mutate(path, message, transform) {
              const response = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (Array.isArray(response.data) || response.data.type !== 'file' || !response.data.content) throw new Error(`Could not load ${path}`);
              const current = Buffer.from(response.data.content, 'base64').toString('utf8');
              const next = transform(current);
              if (next === current) throw new Error(`No changes for ${path}`);
              await github.rest.repos.createOrUpdateFileContents({ owner, repo, path, branch, sha: response.data.sha, message, content: Buffer.from(next, 'utf8').toString('base64') });
            }

            await mutate('docs/SEMANTIC_COVERAGE.md', 'docs: document automatic semantic activation', (source) => {
              let text = source;
              text = replaceOnce(
                text,
                'A semântica melhora recuperação e cobertura, mas **não é requisito para o produto funcionar**: busca textual/fuzzy permanece como fallback completo quando consentimento, cota, índice ou Gemini estiverem indisponíveis.',
                'A semântica melhora recuperação e cobertura, mas **não é requisito para o produto funcionar**: busca textual/fuzzy permanece como fallback completo quando a ativação semântica, cota, índice ou Gemini estiverem indisponíveis.',
                'semantic intro'
              );
              text = replaceOnce(text, '- consentimento semântico: versão `1`.', '- marcador interno de compatibilidade da ativação semântica: versão `1`.', 'semantic contract marker');
              text = replaceOnce(
                text,
                '## Consentimento e fallback\n\nOCR e semântica têm consentimentos separados. A opção semântica começa desativada na cobertura porque embeddings de documentos podem enviar trechos já armazenados ao Gemini.\n\nFallbacks esperados:\n\n- sem consentimento → lexical;',
                '## Ativação privada e fallback\n\nNo uso privado do Fichário, OCR e semântica são ativados automaticamente somente quando a operação precisa deles. A interface não exige confirmação recorrente por arquivo, pesquisa ou análise. Os nomes históricos de RPCs, colunas e migrations que contêm `consent` permanecem como marcadores internos de compatibilidade do backend; eles não representam um checkbox manual no fluxo atual.\n\nA cobertura tenta registrar esse marcador interno antes da primeira execução semântica. Se a ativação automática não puder ser concluída, nenhum trecho precisa ser enviado ao Gemini para aquela tentativa e o modo textual/fuzzy continua disponível. OCR só é acionado para imagens ou páginas visuais que realmente precisem de leitura automática.\n\nFallbacks esperados:\n\n- ativação semântica indisponível → lexical;',
                'semantic activation section'
              );
              return text;
            });

            await mutate('docs/SEARCH_OCR_MATCHING.md', 'docs: document automatic semantic search activation', (source) => {
              let text = source;
              text = replaceOnce(
                text,
                'A camada semântica é opcional e degradável. Sem consentimento, configuração, cota ou provedor, `search_pages` continua pesquisando o corpus inteiro.',
                'A camada semântica é opcional e degradável. Sem ativação semântica, configuração, cota ou provedor, `search_pages` continua pesquisando o corpus inteiro.',
                'search intro'
              );
              text = replaceOnce(
                text,
                '## Consentimento e privacidade\n\nO consentimento da cobertura semântica não é reutilizado silenciosamente para a busca global. A migration `202608101501_global_semantic_search_consent.sql` cria consentimento específico para esta superfície.\n\nAntes desse consentimento, a Edge Function não envia consulta nem texto de páginas ao Gemini. Depois da ativação:',
                '## Ativação e privacidade\n\nA busca global mantém um marcador interno próprio, criado historicamente pela migration `202608101501_global_semantic_search_consent.sql`. No fluxo privado atual, esse marcador é uma compatibilidade técnica: a interface não mostra checkbox nem pede autorização repetida.\n\nA primeira tentativa continua segura: se a Edge Function informar `consent_required`, o cliente registra automaticamente o marcador dedicado e repete a busca uma vez. Se esse registro falhar, a resposta lexical já obtida é preservada e nenhum bloqueio é apresentado ao usuário. Com a camada semântica ativa:',
                'search activation section'
              );
              text = replaceOnce(text, '- consentimento ainda não concedido;', '- ativação semântica não pôde ser registrada;', 'search fallback');
              text = replaceOnce(text, '- consentimento dedicado da busca;', '- ativação dedicada da busca sem confirmação recorrente;', 'search test bullet');
              return text;
            });

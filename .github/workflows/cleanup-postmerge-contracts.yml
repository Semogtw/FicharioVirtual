name: Clean post-merge contracts once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove obsolete prelaunch contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def edit(path, fn):
              p = Path(path)
              before = p.read_text()
              after = fn(before)
              if after != before:
                  p.write_text(after)

          edit('src/routes/import/drive/+page.svelte', lambda s: s.replace(
              "addPdfs([selected.file], { notebookId: notebookId || null, consentGranted: true });",
              "addPdfs([selected.file], { notebookId: notebookId || null });"
          ))

          edit('src/routes/+layout.ts', lambda s: s.replace(
              'let persistedSession = null;',
              'let persistedSession: Awaited<ReturnType<typeof loadPersistedSession>> = null;'
          ))

          files = [
              'tests/unit/stores/import-queue-files.test.ts',
              'tests/unit/stores/import-queue-resume.test.ts',
              'tests/unit/stores/import-queue-cancellation.test.ts'
          ]
          for path in files:
              edit(path, lambda s: s.replace(
                  "\nvi.mock('$lib/services/ocr-consent', () => ({\n\trecordOcrConsent: vi.fn(async () => undefined)\n}));\n",
                  '\n'
              ).replace(
                  "\nvi.mock('$lib/services/ocr-consent', () => ({\n\trecordOcrConsent: dependencies.recordOcrConsent\n}));\n",
                  '\n'
              ))

          edit('tests/unit/stores/import-queue-files.test.ts', lambda s: s.replace(
              "\n\trecordOcrConsent: vi.fn(async () => undefined),",
              ''
          ))

          Path('tests/unit/stores/import-queue-consent.test.ts').unlink(missing_ok=True)
          PY
          pnpm exec prettier --write src/routes/+layout.ts src/routes/import/drive/+page.svelte tests/unit/stores/import-queue-files.test.ts tests/unit/stores/import-queue-resume.test.ts tests/unit/stores/import-queue-cancellation.test.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: remove remaining prelaunch consent contracts'
          git push origin HEAD:main

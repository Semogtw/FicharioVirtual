name: Remove redundant import roles

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-redundant-import-roles.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remove-redundant-import-roles
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Remove redundant region roles
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('src/routes/import/+page.svelte'),
              Path('src/routes/import/pdf/+page.svelte'),
          ]
          marker = '\t\trole="region"\n'
          for path in paths:
              source = path.read_text()
              count = source.count(marker)
              if count != 1:
                  raise SystemExit(f'{path}: expected one redundant role, found {count}')
              path.write_text(source.replace(marker, ''))
          PY

      - name: Commit accessibility cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/import/+page.svelte src/routes/import/pdf/+page.svelte
          git commit -m 'fix: remove redundant import region roles'
          git push origin HEAD:main

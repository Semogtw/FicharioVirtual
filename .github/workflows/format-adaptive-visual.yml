name: Format adaptive visual implementation

on:
  push:
    branches: [feat/adaptive-visual-embeddings]
    paths:
      - .github/workflows/format-adaptive-visual.yml
      - .ci/adaptive-visual-ui/**

permissions:
  contents: write

concurrency:
  group: format-adaptive-visual
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/adaptive-visual-embeddings
          fetch-depth: 0
          persist-credentials: true

      - name: Apply verified UI and benchmark patch
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/adaptive-visual-ui/part-* > /tmp/adaptive-visual-ui.patch
          git apply --check /tmp/adaptive-visual-ui.patch
          git apply /tmp/adaptive-visual-ui.patch

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format adaptive visual files
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            package.json \
            src/lib/services/semantic-search.ts \
            'src/routes/search/+page.svelte' \
            supabase/functions/_shared/background-visual-indexer.ts \
            supabase/functions/_shared/gemini-embedding-client.ts \
            supabase/functions/_shared/semantic-ranking.ts \
            supabase/functions/_shared/visual-embedding-enqueue.ts \
            supabase/functions/ocr-queue-worker/index.ts \
            supabase/functions/semantic-search/index.ts \
            tests/fixtures/search/visual-semantic-benchmark.json \
            tests/unit/routes/search-result-interaction.test.ts \
            tests/unit/search/visual-embedding-routing.test.ts \
            tests/unit/search/visual-semantic-benchmark.test.ts \
            tests/unit/search/visual-semantic-contract.test.ts
          git diff --check
          pnpm lint
          pnpm check

      - name: Commit formatted implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci/adaptive-visual-ui .github/workflows/format-adaptive-visual.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test(search): add visual benchmark and safe result UI'
          git push origin HEAD:feat/adaptive-visual-embeddings

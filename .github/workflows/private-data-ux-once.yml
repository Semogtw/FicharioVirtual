name: Finish private data UX patch once

on:
  push:
    branches:
      - feat/private-data-ux
    paths:
      - .github/workflows/private-data-ux-once.yml

permissions:
  contents: write

jobs:
  patch-shell:
    runs-on: ubuntu-latest
    steps:
      - name: Mount one-time privacy notice in app shell
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'feat/private-data-ux';
            const path = 'src/lib/components/AppShell.svelte';
            const response = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
            if (Array.isArray(response.data) || response.data.type !== 'file' || !response.data.content) {
              throw new Error('Could not load AppShell.svelte');
            }
            let text = Buffer.from(response.data.content, 'base64').toString('utf8');
            const importNeedle = "\timport type { Snippet } from 'svelte';\n";
            const importReplacement = "\timport type { Snippet } from 'svelte';\n\timport DataProcessingNotice from './DataProcessingNotice.svelte';\n";
            if (!text.includes(importNeedle)) throw new Error('Missing AppShell import target');
            text = text.replace(importNeedle, importReplacement);
            const mountNeedle = "\t\t</header>\n\n\t\t<main id=\"main-content\">\n";
            const mountReplacement = "\t\t</header>\n\n\t\t<DataProcessingNotice />\n\n\t\t<main id=\"main-content\">\n";
            if (!text.includes(mountNeedle)) throw new Error('Missing AppShell mount target');
            text = text.replace(mountNeedle, mountReplacement);
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch,
              sha: response.data.sha,
              message: 'feat: show one-time privacy notice in app shell',
              content: Buffer.from(text, 'utf8').toString('base64')
            });

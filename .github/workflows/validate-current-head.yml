name: Validate current head

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - package.json
      - pnpm-lock.yaml
      - svelte.config.js
      - tsconfig.json
      - vite.config.ts
      - static/**
      - src/**
      - supabase/**
      - tests/**
      - tools/**
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: validate-current-head
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Archive the validated source
        run: git archive --format=zip --output=/tmp/fichario-source.zip HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: fichario-source-${{ github.sha }}
          path: /tmp/fichario-source.zip
          if-no-files-found: error
          retention-days: 1

      - name: Publish running receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='[CI] Fichário current HEAD validation'
          issue_number="$(
            gh issue list --state all --limit 100 --json number,title \
              --jq '.[] | select(.title == "[CI] Fichário current HEAD validation") | .number' \
              | head -n 1
          )"
          cat > /tmp/receipt.md <<EOF
          Status: RUNNING
          Commit: ${{ github.sha }}
          Run ID: ${{ github.run_id }}
          Workflow: ${{ github.workflow }}
          EOF
          if [ -z "$issue_number" ]; then
            issue_url="$(gh issue create --title "$title" --body-file /tmp/receipt.md)"
            issue_number="${issue_url##*/}"
          else
            gh issue edit "$issue_number" --body-file /tmp/receipt.md
          fi
          echo "RECEIPT_ISSUE=$issue_number" >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend verification
        id: frontend
        continue-on-error: true
        run: pnpm verify

      - name: Run offline source gates
        id: source
        continue-on-error: true
        run: pnpm test:source:offline

      - name: Install Chromium
        id: chromium
        if: steps.frontend.outcome == 'success'
        continue-on-error: true
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        id: browser
        if: steps.chromium.outcome == 'success'
        continue-on-error: true
        run: pnpm test:e2e

      - name: Upload browser failure evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3

      - name: Set up Deno
        id: deno
        continue-on-error: true
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.8.1

      - name: Check Edge Functions
        id: edge
        if: steps.deno.outcome == 'success'
        continue-on-error: true
        run: pnpm test:functions:check

      - name: Set up Supabase CLI
        id: supabase
        continue-on-error: true
        uses: supabase/setup-cli@v2
        with:
          version: 2.111.0

      - name: Run local database gates
        id: database
        if: steps.supabase.outcome == 'success'
        continue-on-error: true
        run: pnpm test:db:local

      - name: Aggregate verification results
        if: always()
        env:
          FRONTEND: ${{ steps.frontend.outcome }}
          SOURCE: ${{ steps.source.outcome }}
          CHROMIUM: ${{ steps.chromium.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          DENO: ${{ steps.deno.outcome }}
          EDGE: ${{ steps.edge.outcome }}
          SUPABASE: ${{ steps.supabase.outcome }}
          DATABASE: ${{ steps.database.outcome }}
        run: |
          failed=0
          {
            echo '## Verification results'
            echo
            echo '| Gate | Outcome |'
            echo '| --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"
          for gate in FRONTEND SOURCE CHROMIUM BROWSER DENO EDGE SUPABASE DATABASE; do
            outcome="${!gate}"
            echo "| ${gate,,} | $outcome |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$outcome" != 'success' ]; then
              echo "$gate finished with $outcome." >&2
              failed=1
            fi
          done
          exit "$failed"

      - name: Publish final receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${RECEIPT_ISSUE:-}" ]; then
            echo 'Receipt issue was not created.' >&2
            exit 1
          fi
          cat > /tmp/receipt.md <<EOF
          Status: ${{ job.status }}
          Commit: ${{ github.sha }}
          Run ID: ${{ github.run_id }}
          Workflow: ${{ github.workflow }}
          EOF
          gh issue edit "$RECEIPT_ISSUE" --body-file /tmp/receipt.md

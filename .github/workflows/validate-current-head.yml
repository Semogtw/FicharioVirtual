name: Validate current head

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - README.md
      - docs/**
      - package.json
      - pnpm-lock.yaml
      - svelte.config.js
      - tsconfig.json
      - vite.config.ts
      - static/**
      - src/**
      - supabase/**
      - tests/**
      - tools/**
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: validate-current-head
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Archive the validated source
        run: git archive --format=zip --output=/tmp/fichario-source.zip HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fichario-source-${{ github.sha }}
          path: /tmp/fichario-source.zip
          if-no-files-found: error
          retention-days: 1

      - name: Publish running receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='[CI] Fichário current HEAD validation'
          issue_number="$(
            gh issue list --state all --limit 100 --json number,title \
              --jq '.[] | select(.title == "[CI] Fichário current HEAD validation") | .number' \
              | head -n 1
          )"
          cat > /tmp/receipt.md <<EOF
          Status: RUNNING
          Commit: ${{ github.sha }}
          Run ID: ${{ github.run_id }}
          Workflow: ${{ github.workflow }}
          EOF
          if [ -z "$issue_number" ]; then
            issue_url="$(gh issue create --title "$title" --body-file /tmp/receipt.md)"
            issue_number="${issue_url##*/}"
          else
            gh issue edit "$issue_number" --body-file /tmp/receipt.md
          fi
          echo "RECEIPT_ISSUE=$issue_number" >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend verification
        id: frontend
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm verify 2>&1 | tee /tmp/frontend-verification.log

      - name: Upload frontend failure log
        if: steps.frontend.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-failure-${{ github.sha }}
          path: /tmp/frontend-verification.log
          if-no-files-found: error
          retention-days: 3

      - name: Prepare Prettier repair patch
        id: formatting
        if: steps.frontend.outcome == 'failure'
        continue-on-error: true
        run: |
          pnpm exec prettier --write .
          git diff --binary -- . > /tmp/prettier-repair.patch
          test -s /tmp/prettier-repair.patch

      - name: Upload Prettier repair patch
        if: steps.formatting.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prettier-repair-${{ github.sha }}
          path: /tmp/prettier-repair.patch
          if-no-files-found: error
          retention-days: 1

      - name: Run offline source gates
        id: source
        continue-on-error: true
        run: pnpm test:source:offline

      - name: Install Chromium
        id: chromium
        if: steps.frontend.outcome == 'success'
        continue-on-error: true
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        id: browser
        if: steps.chromium.outcome == 'success'
        continue-on-error: true
        run: pnpm test:e2e

      - name: Upload browser failure evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3

      - name: Set up Deno
        id: deno
        continue-on-error: true
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: 2.8.1

      - name: Check Edge Functions
        id: edge
        if: steps.deno.outcome == 'success'
        continue-on-error: true
        run: pnpm test:functions:check

      - name: Set up Supabase CLI
        id: supabase
        continue-on-error: true
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: 2.111.0

      - name: Run local database gates
        id: database
        if: steps.supabase.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm test:db:local 2>&1 | tee /tmp/database-verification.log

      - name: Upload database failure log
        if: steps.database.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: database-failure-${{ github.sha }}
          path: /tmp/database-verification.log
          if-no-files-found: error
          retention-days: 3

      - name: Publish verification summary
        if: always()
        env:
          FRONTEND_OUTCOME: ${{ steps.frontend.outcome }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          CHROMIUM_OUTCOME: ${{ steps.chromium.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          DENO_OUTCOME: ${{ steps.deno.outcome }}
          EDGE_OUTCOME: ${{ steps.edge.outcome }}
          SUPABASE_OUTCOME: ${{ steps.supabase.outcome }}
          DATABASE_OUTCOME: ${{ steps.database.outcome }}
        run: |
          {
            echo '## Verification results'
            echo
            echo '| Gate | Outcome |'
            echo '| --- | --- |'
            echo "| frontend | $FRONTEND_OUTCOME |"
            echo "| source | $SOURCE_OUTCOME |"
            echo "| chromium | $CHROMIUM_OUTCOME |"
            echo "| browser | $BROWSER_OUTCOME |"
            echo "| deno | $DENO_OUTCOME |"
            echo "| edge | $EDGE_OUTCOME |"
            echo "| supabase | $SUPABASE_OUTCOME |"
            echo "| database | $DATABASE_OUTCOME |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reject incomplete verification
        if: always()
        env:
          FRONTEND_OUTCOME: ${{ steps.frontend.outcome }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          CHROMIUM_OUTCOME: ${{ steps.chromium.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          DENO_OUTCOME: ${{ steps.deno.outcome }}
          EDGE_OUTCOME: ${{ steps.edge.outcome }}
          SUPABASE_OUTCOME: ${{ steps.supabase.outcome }}
          DATABASE_OUTCOME: ${{ steps.database.outcome }}
        run: |
          printf '%s\n' \
            "frontend=$FRONTEND_OUTCOME" \
            "source=$SOURCE_OUTCOME" \
            "chromium=$CHROMIUM_OUTCOME" \
            "browser=$BROWSER_OUTCOME" \
            "deno=$DENO_OUTCOME" \
            "edge=$EDGE_OUTCOME" \
            "supabase=$SUPABASE_OUTCOME" \
            "database=$DATABASE_OUTCOME"

          for outcome in \
            "$FRONTEND_OUTCOME" \
            "$SOURCE_OUTCOME" \
            "$CHROMIUM_OUTCOME" \
            "$BROWSER_OUTCOME" \
            "$DENO_OUTCOME" \
            "$EDGE_OUTCOME" \
            "$SUPABASE_OUTCOME" \
            "$DATABASE_OUTCOME"; do
            if [ "$outcome" != 'success' ]; then
              echo "Incomplete verification outcome: $outcome" >&2
              exit 1
            fi
          done

          echo 'All required verification gates succeeded.'

      - name: Publish final receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FRONTEND_OUTCOME: ${{ steps.frontend.outcome }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          CHROMIUM_OUTCOME: ${{ steps.chromium.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          EDGE_OUTCOME: ${{ steps.edge.outcome }}
          DATABASE_OUTCOME: ${{ steps.database.outcome }}
        run: |
          if [ -z "${RECEIPT_ISSUE:-}" ]; then
            echo 'Receipt issue was not created.' >&2
            exit 1
          fi
          cat > /tmp/receipt.md <<EOF
          Status: ${{ job.status }}
          Commit: ${{ github.sha }}
          Run ID: ${{ github.run_id }}
          Workflow: ${{ github.workflow }}

          Frontend: $FRONTEND_OUTCOME
          Source: $SOURCE_OUTCOME
          Chromium: $CHROMIUM_OUTCOME
          Browser: $BROWSER_OUTCOME
          Edge: $EDGE_OUTCOME
          Database: $DATABASE_OUTCOME
          EOF
          gh issue edit "$RECEIPT_ISSUE" --body-file /tmp/receipt.md

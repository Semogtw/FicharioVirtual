project_id = "fichario-virtual"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/**"]
enable_signup = false
minimum_password_length = 10

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true

[functions.process-ocr]
verify_jwt = true

[functions.ocr-queue-kick]
verify_jwt = true

# Server-to-server only. The function performs its own constant-time check of a
# dedicated high-entropy worker secret and never accepts browser credentials.
[functions.ocr-queue-worker]
verify_jwt = false

[functions.semantic-coverage]
verify_jwt = true

[functions.semantic-search]
verify_jwt = true

[functions.semantic-index]
verify_jwt = true

# Server-to-server semantic indexing. It reuses the internal worker credential
# and applies page writes through a narrow service-role dispatcher.
[functions.semantic-index-worker]
verify_jwt = false

[functions.delete-document]
verify_jwt = true

[functions.drive-oauth-start]
verify_jwt = true

[functions.drive-oauth-callback]
verify_jwt = false

[functions.drive-access-token]
verify_jwt = true

[functions.drive-resolve-folder]
verify_jwt = true

[functions.drive-run-jobs]
verify_jwt = true

[functions.drive-sync]
verify_jwt = true

# Pair-code redemption is intentionally public at the gateway. The function itself
# accepts unauthenticated requests only for the short-lived one-time redeem action;
# legacy pair/revoke paths validate the browser bearer token explicitly.
[functions.desktop-ocr-pair]
verify_jwt = false

[functions.desktop-ocr-worker]
verify_jwt = false
